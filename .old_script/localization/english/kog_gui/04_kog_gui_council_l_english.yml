l_english:
 # Ecumenical Council General
 kog_gui_ecumenical_council_header: "The Ecumenical Council"
 kog_gui_ecumenical_council_none: "#italic #lore There is no [concept_ecumenical_council] in session#!"
 kog_gui_ecumenical_council_oppose: "This will commit our #bold #white [GetPlayer.MakeScope.Var('kog_votes_var').GetValue]#!#! votes to opposing the proposed reform."
 kog_gui_ecumenical_council_abstain: "This will withdraw our #bold #white [GetPlayer.MakeScope.Var('kog_votes_var').GetValue]#!#! votes towards either side of the proposed reform."
 kog_gui_ecumenical_council_support: "This will commit our #bold #white [GetPlayer.MakeScope.Var('kog_votes_var').GetValue]#!#! votes to supporting the proposed reform."
 kog_gui_support_winning: "The council favors the #bold Reformist Camp#!."
 kog_gui_oppose_winning: "The council favors the #bold Conservative Camp#!."
 kog_gui_noone_winning: "The Council is #bold Undecided#!."
 kog_gui_council_stance: "Stance: #yellow [GetPlayer.MakeScope.GetCountry.GetCustom('kog_council_stance_type')]#!"
 
 # Catholic Ecumenical Council Panel
 kog_gui_catholic_council_location: "The #o Council#! of the #yellow Vatican#!"
 kog_gui_catholic_council_host: "#italic Convoked by #yellow [GetGlobalVariable('kog_catholic_host_var').GetCountry.GetNameNoFlag]#!#!
 kog_gui_catholic_council_matter: "Subject Matter: #italic [GetPlayer.MakeScope.GetCountry.GetCustom('kog_catholic_matter_type')]#!"
 kog_gui_catholic_council_votes: "#italic #khoine [GetPlayer.GetNameNoFlag] has [GetPlayer.MakeScope.Var('kog_votes_var').GetValue] vote(s)#!#!"
 kog_gui_catholic_council_supporters: "Votes in Favor: #khoine [GetGlobalVariable('kog_catholic_support_var').GetValue]#!"
 kog_gui_catholic_council_detractors: "Votes Against: #khoine [GetGlobalVariable('kog_catholic_opposition_var').GetValue]#!"
 kog_gui_catholic_council_outcome: "The Council is [GetPlayer.MakeScope.GetCountry.GetCustom('kog_catholic_council_outcome_type')]"
 
