l_english:
 # DLC info
 dlc_kog: "The Kingdom of God"
 dlc_kog_desc: "Take up the cross and lead the followers of Christ into the Victorian Era! From the centralized and dogmatic Catholic Church in Rome to the disunified Churches of the East under Muslim rule, take charge of the flock as the faith struggles to find its place in this rapidly changing world.$com_ttdl$#bold The Kingdom of God#! currently covers the following faiths: $com_nlbp$$kog_catholic$ $com_nlbp$$kog_orthodox$ $com_nlbp$$kog_br_religion_elysian_orthodox$ \n#bold The Kingdom of God#! is dependent on the following mods:\n • $gbbf_cmf$\n$kog_compatibility_br$"
 
 kog_journal_lobby: "#v Added by Mod: $kog_name$#!"
 kog_integrates_votp: "@information! #italic #bold #lore #tooltippable #tooltip:[GetRawTextTooltipTag('kog_dlc_content_info')] Integrates Content#!#! from DLC: Voice of the People#!#!#!"
 kog_integrates_ip3: "@information! #italic #bold #lore #tooltippable #tooltip:[GetRawTextTooltipTag('kog_dlc_content_info')] Integrates Content#!#! from DLC: National Awakening#!#!#!"
 kog_integrates_ip4: "@information! #italic #bold #lore #tooltippable #tooltip:[GetRawTextTooltipTag('kog_dlc_content_info')] Integrates Content#!#! from DLC: Iberian Twilight#!#!#!"
 
 kog_dlc_content_info: "DLC-specific content will only be provided if that DLC is owned and active"
