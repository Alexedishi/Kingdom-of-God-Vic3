 kog_roman_rite: "#yellow #tooltip:[GetRawTextTooltipTag('kog_roman_rite_details')] Roman Rite#!#!"
 kog_roman_rite_details: "The #bold Roman Rite#!, #italic Rītus Rōmānus in Latin#!, is the primary [concept_liturgical_rite] of the [GetReligion('catholic').GetName] church. Recognized for its practical and dignified expression, its rituals harken back to an era when Christendom lived in the shadows of the caesars of Rome.\n$TOOLTIP_DELIMITER$\n$kog_roman_rite_modifier$"
 kog_roman_rite_modifier: "#bold This rite gives the following effects at maximum $kog_faith_capacity$:\n[GetStaticModifier('modifier_kog_roman_rite_placeholder').GetDesc]#!"

 kog_byzantine_rite: "#yellow #tooltip:[GetRawTextTooltipTag('kog_byzantine_rite_details')] Byzantine Rite#!#!"
 kog_byzantine_rite_details: "The #bold Byzantine Rite#!, also called the Greek Rite, encompasses the range of rituals and traditions that exemplify the [GetReligion('orthodox').GetName] church. Developed from centuries of syncretism between the traditions of Constantinople and the communities of the Levant, this rite is know for its elaborate and mystical traits.\n$TOOLTIP_DELIMITER$\n$kog_byzantine_rite_modifier$"
 kog_byzantine_rite_modifier: "#bold This rite gives the following effects at maximum $kog_faith_capacity$:\n[GetStaticModifier('modifier_kog_byzantine_rite_placeholder').GetDesc]#!"

 kog_alexandrian_rite: "#yellow #tooltip:[GetRawTextTooltipTag('kog_alexandrian_rite_details')] Alexandrian Rite#!#!"
 kog_alexandrian_rite_details: "The #bold Alexandrian Rite#! traces its split from the remainder of Christianity to the rejection of the Council of Chalcedon by the [GetReligion('oriental_orthodox').GetName]. This rite is characterized by the use of a variety of liturgies, both historically and in the present.\n$TOOLTIP_DELIMITER$\n$kog_alexandrian_rite_modifier$"
 kog_alexandrian_rite_modifier: "#bold This rite gives the following effects at maximum $kog_faith_capacity$:\n[GetStaticModifier('modifier_kog_alexandrian_rite_placeholder').GetDesc]#!"

 kog_armenian_rite: "#yellow #tooltip:[GetRawTextTooltipTag('kog_armenian_rite_details')] Armenian Rite#!"
 kog_armenian_rite_details: "\n$TOOLTIP_DELIMITER$\n$kog_armenian_rite_modifier$"
 kog_armenian_rite_modifier: "#bold This rite gives the following effects at maximum $kog_faith_capacity$:\n[GetStaticModifier('modifier_kog_armenian_rite_placeholder').GetDesc]#!"

 kog_syro_antiochian_rite: "#yellow #tooltip:[GetRawTextTooltipTag('kog_syro_antiochian_rite_details')] Syro-Antiochian Rite#!"
