l_english:
 # [Concept('','$$')]
 
 concept_autocephaly: "Autocephaly"
 concept_autocephaly_desc: "While nominally a single ecumenical church, the non-[GetReligion('catholic').GetName] Church structures are much more decentralized than their Western counterpart in Rome. Every nation plays host to prominent bishops that exert influence over the worship in their domain, sometimes in deviation from the #italic Primus Inter Pares#!, or First Among Equals, $kog_patriarch$ at the head of the church. #bold Autocephalous#! churches have heads who do not report to any higher Bishop such as the Patriarch of Constantinople or the Bishop of Rome."
 concept_autocephalous: "Autocephalous"
 kog_autocephaly: "[concept_autocephaly]"
 kog_autocephalous: "[Concept('concept_autocephaly','$concept_autocephalous$')]"
 
 concept_canon_law: "Canon Law"
 concept_canon_law_desc: "#bold Canon Laws#! are the ordinances and regulations made by church leadership for the administration of a Christian organization and its members. These can take many forms ranging from the centralized #italic Ius Canonicum#! of the [GetReligion('catholic').GetName] Church to the localized ordinances of Congregationalist [GetReligion('protestant').GetName] churches."
 concept_canon_laws: "Canon Laws"
 kog_canon_law: "[concept_canon_law]"
 kog_canon_laws: "[Concept('concept_canon_law','$concept_canon_laws$')]"
 
 concept_canon_law_compliance: "Canon Law Compliance"
 concept_canon_law_compliance_desc: "Canon Law Compliance is a measure of how well-aligned a [concept_country]'s legal framework is aligned with that of its [concept_mother_church]. Failure to abide by the $kog_canon_laws$ of the church will invite friction between the church and state."
 concept_compliance: "Compliance"
 kog_canon_law_compliance: "[concept_canon_law_compliance]"
 kog_compliance: "[Concept('concept_canon_law_compliance','$concept_compliance$')]"
 
 concept_canon_law_group: "Canon Law Group"
 concept_canon_law_group_desc: "A $concept_canon_law_group$ contains several $kog_canon_laws$ that affect aspects of the church's member $kog_countries$ in different ways. Each $concept_canon_law_group$ can only have one $concept_canon_law$ active at a time.""
 kog_canon_law_group: "[concept_canon_law_group]"
 
 concept_collegium: "College of Cardinals"
 concept_collegium_desc: "The College of Cardinals is the body of all $kog_cardinals$ appointed by the $kog_pope$ of a given church. These individuals are seen as the most senior and prominent bishops of a church and serve as semi-formal advisors to the pontiff. Their most important act, however, typically comes with the election of a new $kog_pope$ upon the death a sitting pontiff."
 
 concept_communion: "Communion"
 concept_communion_desc: "Communion is the metaphysical bond that is seen as connecting individual Christians with each other and Jesus Christ. As an administrative concept, it represents the close alignment of congregations in matters of authority and doctrine. Typically, churches in communion with each other will align their doctrines with each other, even if a high level of local autonomy is retained."
 concept_in_communion: "In Communion"
 kog_communion: "[concept_communion]"
 kog_in_communion: "[Concept('concept_communion','$concept_in_communion$')]"
 
 concept_crusades: "Crusades"
 concept_crusades_desc: "The #bold Crusades#! were a series of religiously-motivated wars initiated by Western European countries against non-Christians. While popularly conceptualized as centered on reclaiming the Holy Land from Muslim rulers, similar religious conflicts saw Christian expansion into Scandinavia, Eastern Europe, and Iberia. These wars were generally motivated by a desire for fame from nobles and a desire for indulgences by the commonfolk."
 concept_crusade: "Crusade"
 kog_crusades: "[concept_crusades]"
 kog_crusade: "[Concept('concept_crusades','$concept_crusade$')]"
 
 concept_ecumenical_council: "Ecumenical Council"
 concept_ecumenical_council_desc: "#bold Ecumenical Councils#! are large gatherings of prominent bishops for the purpose of settling religious questions or disputes. First called by the Roman Emperors, these councils have become a cornerstone of making critical interpretations of or changes to church dogma. In modern Christianity, these are held to be the supreme legal authority in the church... provided their contents are accepted by the Christian community at large."
 concept_ecumenical_councils: "Ecumenical Councils"
 concept_council: "Ecumenical Council"
 concept_councils: "Ecumenical Councils"
 kog_ecumenical_council: "[concept_ecumenical_council]"
 kog_ecumenical_councils: "[Concept('concept_ecumenical_council','$concept_ecumenical_councils$')]"
 kog_council: "[Concept('concept_ecumenical_council','$concept_council$')]"
 kog_councils: "[Concept('concept_ecumenical_council','$concept_councils$')]"
 
 concept_ecumenism: "Ecumenism"
 concept_ecumenism_desc: "Ecumenism is the belief and goal that all Christian communities, regardless of differences in creeds and doctrine should cooperate to bring together the various Christian denominations and reunite into a Great Church. While unthinkable in previous eras, this idea has begun to take hold as Traditionalist thought slowly gives way to more moderate thinking."
 concept_ecumenical_relations: "Ecumenical Relations"
 kog_ecumenism: "[concept_ecumenism]"
 kog_ecumenical_relations: "[Concept('concept_ecumenism','$concept_ecumenical_relations$')]"
 
 concept_episcopal_seat: "Episcopal Seat"
 concept_episcopal_seat_desc: "In late antiquity, the early Christian church was organized into five major regions, each centered on the ancient Roman cites of #yellow Rome#!, #yellow Constantinople#!, #yellow Antioch#!, #yellow Jerusalem#!, and #yellow Alexandria#!. Following the Great Schism, the latter four would go on to form the #bold Eastern Orthodoxy.\n\nWith the spread of Christianity to the lands of the Slavs in the middle ages, #yellow Moscow#! has come to be recognized as one of the most important cities in the East, alongside the ancient Patriarchates."
 concept_patriarch: "Patriarch"
 concept_patriarchs: "Patriarchs"
 concept_patriarchate: "Patriarchate"
 concept_episcopal_seats: "Episcopal Seats"
 concept_seat: "Seat"
 concept_seats: "Seats"
 concept_episcopal_seat_relations: "Episcopal Seat Relations"
 concept_seat_relations: "Seat Relations"
