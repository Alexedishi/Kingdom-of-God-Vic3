 # [Concept('','$$')]
 
 concept_autocephaly: "Autocephaly"
 concept_autocephaly_desc: "While nominally a single ecumenical church, the non-[GetReligion('catholic').GetName] Church structures are much more decentralized than their Western counterpart in Rome. Every nation plays host to prominent bishops that exert influence over the worship in their domain, sometimes in deviation from the #italic Primus Inter Pares#!, or First Among Equals, $kog_patriarch$ at the head of the church. #bold Autocephalous#! churches have heads who do not report to any higher Bishop such as the Patriarch of Constantinople or the Bishop of Rome."
 concept_autocephalous: "Autocephalous"
 kog_autocephaly: "[concept_autocephaly]"
 kog_autocephalous: "[Concept('concept_autocephaly','$concept_autocephalous$')]"
 
 concept_canon_law: "Canon Law"
 concept_canon_law_desc: "#bold Canon Laws#! are the ordinances and regulations made by church leadership for the administration of a Christian organization and its members. These can take many forms ranging from the centralized #italic Ius Canonicum#! of the [GetReligion('catholic').GetName] Church to the localized ordinances of Congregationalist [GetReligion('protestant').GetName] churches."
 concept_canon_laws: "Canon Laws"
 kog_canon_law: "[concept_canon_law]"
 kog_canon_laws: "[Concept('concept_canon_law','$concept_canon_laws$')]"
 
