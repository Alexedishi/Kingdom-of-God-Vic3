 kog_relations: "[Concept('concept_episcopal_seat','$concept_relations$')]"
 
 concept_encyclical: "Encyclical"
 concept_encyclical_desc: "An #bold Encyclical#! is a circular letter sent out from either the Pope or other senior Bishops typically concerning matters of doctrine or dispute, meant to provide both clarification and direction to both the clergy and laity."
 kog_encyclical: "[concept_encyclical]"
 
 concept_faith_capacity: "Religious Eminence"
 concept_faith_capacity_desc: "#bold Religious Eminence#! represents the extent to which the [concept_government] exerts influence, and sometimes direct control, over the [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant]. Generally, this value indicates a country’s ability to sway its local bishops, and our religious community at large, towards the will of the state."
 concept_faith_capacity_catholic: "Papal Eminence"
 concept_faith_capacity_orthodox: "Patriarchal Eminence"
 concept_faith_capacity_oriental: "Synodal Eminence"
 concept_faith_capacity_elysian: "Synkletos Eminence"
 concept_faith_capacity_anglican: "Primate Eminence"
 concept_faith_capacity_lutheran: "Confessional Eminence"
 kog_faith_capacity: "[concept_faith_capacity]"
 kog_faith_capacity_catholic: "[Concept('concept_faith_capacity','$concept_faith_capacity_catholic$')]"
 kog_faith_capacity_orthodox: "[Concept('concept_faith_capacity','$concept_faith_capacity_orthodox$')]"
 kog_faith_capacity_oriental: "[Concept('concept_faith_capacity','$concept_faith_capacity_oriental$')]"
 kog_faith_capacity_elysian: "[Concept('concept_faith_capacity','$concept_faith_capacity_elysian$')]"
 kog_faith_capacity_anglican: "[Concept('concept_faith_capacity','$concept_faith_capacity_anglican$')]"
 kog_faith_capacity_lutheran: "[Concept('concept_faith_capacity','$concept_faith_capacity_lutheran$')]"
 
 concept_gravitas: "Collegial Prominence"
 concept_gravitas_alt: "Pope Points"
 concept_gravitas_desc: "#bold Collegial Prominence#! is a measure of a [concept_character]'s weight within the [concept_collegium]. The character with the highest $concept_gravitas$ will be elected as the next $kog_pope$ upon the death of the sitting pontiff."
 
 concept_great_schism: "The Great Schism"
 concept_great_schism_desc: "The #bold Great Schism#!, or East-West Schism, is a term used to describe the complex chain of events that led to the disintegration of communion between $kog_rome$ and the $kog_eastern_seats$. This division between the churches administered from Rome and those guided by Constantinople has led to deviations in liturgical and dogmatic traditions."
 kog_great_schism: "[concept_great_schism]"
 
 concept_head_of_faith: "Head of Faith"
 concept_head_of_faith_desc: "The leader or ruler of a religious denomination. Their authority and powers are determined by the $kog_canon_laws$ of that denomination."
 concept_faith: "Faith"
 concept_faiths: "Faiths"
 concept_pope: "Pope"
 concept_ecumenical_patriarch: "Ecumenical Patriarch"
 concept_catholicos: "Catholicos"
 kog_pope: "[Concept('concept_head_of_faith','$kog_pope$')]"
 kog_ecumenical_patriarch: "[Concept('concept_head_of_faith','$kog_ecumenical_patriarch$')]"
 kog_catholicos: "[Concept('concept_head_of_faith','$kog_catholicos$')]"
 
 concept_holy_site: "Holy Site"
 concept_holy_site_desc: "Holy Site"
 concept_holy_sites: "Holy Sites"
 kog_holy_site: "[concept_holy_site]"
 kog_holy_sites: "[Concept('concept_holy_site','$concept_holy_sites$')]"
 
 concept_liturgical_language: "Liturgical Language"
 concept_liturgical_language_desc: "A #bold Liturgical Language#! the language in which a church conducts its worship ceremonies. While priests will communicate with the faithful in their native language, worship services are often conducted in archaic forms of Latin or Greek."
 kog_liturgical_language: "[concept_liturgical_language]"
 
 concept_liturgical_rite: "Liturgical Rite"
 concept_liturgical_rite_desc: "A #bold Liturgical Rite#! is a pattern for worship that provides structure for regular church services in a Christian communities. These take many forms from the centralized rituals prescribed by the [GetReligion('catholic').GetName] church to unique rituals localized to small communities."
 concept_liturgical_rites: "Liturgical Rite"
 concept_rite: "Rite"
 concept_rites: "Rite"
 kog_liturgical_rite: "[concept_liturgical_rite]"
 kog_liturgical_rites: "[Concept('concept_liturgical_rite','$concept_liturgical_rites$')]"
 kog_rite_concept: "[Concept('concept_liturgical_rite','$concept_rite$')]"
 kog_rites_concept: "[Concept('concept_liturgical_rite','$concept_rites$')]"
 
 concept_matter_of_debate: "Matter of Debate"
 concept_matter_of_debate_desc: ""
 concept_matter: "Matter"
 concept_debate: "Debate"
 kog_matter: "[Concept('concept_matter_of_debate','$concept_matter$')]"
 kog_debate: "[Concept('concept_matter_of_debate','$concept_debate$')]"
 
 concept_metropolitan_bishop: "Metropolitan Bishop"
 concept_metropolitan_bishop_desc: "Metropolitan Bishop"
 kog_metropolitan_bishop: "[concept_metropolitan_bishop]"
 
 concept_mother_church: "Mother Church"
 concept_mother_church_desc: "All churches in Christendom claim descent from the apostles of Christ in one way or another. A #bold Mother Church#! represents the oldest, and typically most prominent, church within a denomination. This church is often either the center of authority in that denomination or occupies a position of relatively increased authority compared to other churches."
 
 concept_national_piety: "National Piety"
 concept_national_piety_desc: "#bold National Piety#! indicates to what extent a [concept_country] has put the teachings of Jesus Christ into practice by providing for the well-being of the downtrodden in society."
 
 concept_omen: "Omen"
 concept_omen_desc: "Divine Omens are signs of good fortune from heaven sent from God to motivate the faithful. These can take many forms ranging from small events in nature to life-changing experiences. For the church, these omens are often used to steer the actions and lifestyles of their flock."
 concept_omens: "Omens"
 concept_auspicious_omen: "Auspicious Omen"
 concept_auspicious_omens: "Auspicious Omens"
 concept_apparition: "Apparition"
 concept_marian_apparition: "Marian Apparition"
 concept_icon: "Icon"
 concept_religious_icon: "Religious Icon"
 
 concept_personal_piety: "Personal Piety"
 concept_personal_piety_desc: "#bold Personal Piety#! is a measure of a character’s standing as a follower of Christ’s teachings. This value is governed by a character’s personality traits."
 
 concept_schism: "Schism"
 concept_schism_desc: "A Schism is a break in [concept_communion] within a religious hierarchy. This can occur over administrative issues or deeper divisions such as disagreements over doctrine. Schism is typically the first step undertaken by a church seeking [concept_autocephaly]."
 concept_schismatic: "Schismatic"
 concept_in_schism: "In Schism"
 kog_schism: "[concept_schism]"
 kog_schismatic: "[Concept('concept_schism','$concept_schismatic$')]"
 kog_in_schism: "In [Concept('concept_schism','$concept_in_schism$')]"
 
 concept_tithing: "Tithing"
 concept_tithing_desc: "Tithing is the act of paying a portion (typically one tenth) of something as a contribution to the church or government a means of supporting the church. While absent as a mandatory act in most branches of Christianity, compulsory tithing has found purchase in several branches of [GetReligion('protestant').GetName] Christianity."
 concept_tithe: "Tithe"
 kog_tithing: "[concept_tithing]"
 kog_tithe: "[Concept('concept_tithing','$concept_tithe$')]"