l_english:
 ## Canon Laws
 concept_canon_law: "Canon Law"
 concept_canon_law_desc: "#bold Canon Law#! is a set of ordinances and regulations made by church leadership for the administration of a Christian organization or church and its members. These can take many forms ranging the central #italic Ius Canonicum#! of the [GetReligion('catholic').GetName] church to the localized ordinances of Congregationalist [GetReligion('protestant').GetName] churches."
 
 kog_canon_lawgroup_religious_law: "Religious Law"
 kog_canon_lawgroup_religious_law_desc: "A [concept_country]#o 's#! #bold Religious Law#! governs the relationship between Church and State and their ability to directly intervene in the affairs of each other."
 kog_canon_law_theocracy: "Theocracy"
 kog_canon_law_theocracy_desc: "The government is ruled by the clergy and their interpretation of holy scripture. There is no discernible point where the apparatus of the church ends and that of the state begins."
 kog_canon_law_state_religion: "State Religion"
 kog_canon_law_state_religion_desc: "The church is an official organ of the state. Bishops are appointed to their posts with the direct advice and consent of the government. Laws that are objectionable to the church are subject to condemnation by the Archbishop of State."
 kog_canon_law_freedom_of_conscience: "Freedom of Conscience"
 kog_canon_law_freedom_of_conscience_desc: "The state has an official state religion but the people may choose what to believe. The church operates as an independent entity, but is expected to remain a bulwark of state legitimacy in exchange for state support."
 kog_canon_law_total_separation: "Total Separation"
 kog_canon_law_total_separation_desc: "No church or faith may interfere in government function, and no religion may be discriminated against. The church acts with total autonomy, but risks becoming sidelined in political affairs."
 kog_canon_law_atheist_state: "Atheist State"
 kog_canon_law_atheist_state_desc: "Preaching religious belief is prohibited, and practicing one is frowned upon. The church struggles to survive under such a hostile environment and may bring aggression against the state if not managed."
 
 kog_canon_lawgroup_apostolic_succession: "Apostolic Succession"
 kog_canon_lawgroup_apostolic_succession_desc: "#bold Apostolic Succession#! is the belief by which a church traces the transmission of grace and ministerial authority from the disciples of Christ to the modern day. More conservative denominations assert that the consecration of Bishops by other Bishops is the only way to maintain the validity of priestly orders, while many [GetReligion('protestant').GetName] denominations assert this continuity is unnecessary and rooting in fundamental misunderstandings of scripture."
 kog_canon_law_papal_primacy: "Papal Primacy"
 kog_canon_law_papal_primacy_desc: "A single Bishop is elevated above the all others and wields sovereign and absolute authority over all other Bishops. In such a system, deviation from the mother church is tantamount to [concept_schism]."
 kog_canon_law_synodality: "Synodality"
 kog_canon_law_synodality_desc: "Churches are lead by group of elected bishops who cooperate in administering the church. While specific Bishops may be recognized as more senior or prestigious, no church hold authority over any other."
 kog_canon_law_congregationalism: "Congregationalism"
 kog_canon_law_congregationalism_desc: "Every local church, or congregation, operates with full independence as has full rights to interpret and preach scripture. In such a system, any center authority is hypothetical at best and fundamental theological disagreements are commonplace."
 
 kog_canon_lawgroup_social_role: "Social Role"
 kog_canon_lawgroup_social_role_desc: "The #bold Social Role#! of the church guides the methodology by which the church engages with society. In more conservative churches, the clergy will act to uphold the "traditional values of society," while more activist churches will aim to fight for the well-being of society, even when it brings the clergy into conflict with entrenched interests."
 kog_canon_law_moral_authority: "Moral Authority"
 kog_canon_law_moral_authority_desc: "The clergy are not only the foundation of society, but their interpretation of what is moral behavior and not is considered essential in society, regardless of any impingement personal freedoms."
 kog_canon_law_moral_guidance: "Moral Guidance"
 kog_canon_law_moral_guidance_desc: "The clergy are expected to provide social counsel and live as beacons of morality. However, they are limited their ability to interfere in personal affairs."
 kog_canon_law_social_activism: "Social Activism"
 kog_canon_law_social_activism_desc: "The clergy encourage the laity to engage in social causes, such as tolerance of minorities or the rights of women, both during liturgy and in their role as social counsel."
 kog_canon_law_modernizing_force: "Modernizing Force"
 kog_canon_law_modernizing_force_desc: "The clergy are commanded to directly engage in social causes, directly participating in marches and strikes, even when this puts them at risk of person harm or the church at risk of retaliation."
 
 kog_canon_lawgroup_stance_on_sciences: "Stance on the Sciences"
 kog_canon_lawgroup_stance_on_sciences_desc: "Christianity has a complicated relationship with the church, ranging from promoting scientific innovation to resisting findings that contradict scripture. A church's #bold Stance on the Sciences#! provides the framework by which the church administration interacts with innovation and discovery."
 kog_canon_law_scriptural_supremacy: "Scriptural Supremacy"
 kog_canon_law_scriptural_supremacy_desc: "The church holds that the only truth is that which can be gleaned from scripture. Any contradiction with scripture is condemned as heresy and, where possible, prosecuted as criminal."
 kog_canon_law_scriptural_favoritism: "Scriptural Favoritism"
 kog_canon_law_scriptural_favoritism_desc: "The church favors rationalizing scientific discoveries with the scripture. While not denying the validity of scientific findings, the church asserts many phenomena to be divine in nature."
 kog_canon_law_scientific_disengagement: "Scientific Disengagement"
 kog_canon_law_scientific_disengagement_desc: "The church takes no particular stance on the sciences and hold no specific stances on the validity or merit of scientific discovery."
 kog_canon_law_scientific_patronage: "Scientific Patronage"
 kog_canon_law_scientific_patronage_desc: "The church takes an active role in promoting the sciences, by patronizing academic institutions and funding private initiatives."
 kog_canon_law_scientific_crusage: "Scientific Crusade"
 kog_canon_law_scientific_crusage_desc: "The church is committed to the cause of scientific discovery, with the clergy preaching innovation as the means to understand the mystery of God's creation."

