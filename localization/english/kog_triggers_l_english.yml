 kog_has_junior_patriarch_approval:  "[GetPlayer.GetNameNoFlag] has #bold 100 or greater $kog_relations$ with any #tooltippable #tooltip:[GetRawTextTooltipTag('kog_junior_seats')] Junior#!#! [Concept('concept_episcopal_seat','$concept_patriarchate$')]"
 kog_has_senior_patriarch_approval:  "[GetPlayer.GetNameNoFlag] has #bold 100 or greater $kog_relations$ with any #tooltippable #tooltip:[GetRawTextTooltipTag('kog_senior_seats')] Senior#!#! [Concept('concept_episcopal_seat','$concept_patriarchate$')]"
 
