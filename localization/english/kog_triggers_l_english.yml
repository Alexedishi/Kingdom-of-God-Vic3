 kog_seat_disapproval_trigger: "[GetPlayer.GetNameNoFlag] has $kog_relations$ of #bold #red 50#! or less#! with the $kog_seat$ of [SCOPE.GetFlagName('kog_seat_opinion_trigger_type')]"
