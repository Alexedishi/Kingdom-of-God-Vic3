 notification_notification_kog_divine_mandate_lost_name: "Divine Mandate Lost"
 notification_notification_kog_divine_mandate_lost_desc: "Our recent legal reforms have stir controversy amongst the clergy. As a result, the Ecumenical Patriarch has rescinded his blessing of our administration, causing us to lose the [concept_timed_modifier] #bold Divine Mandate#!."
 notification_notification_kog_secularism_denounced_removed_name: "Denunciation of Secularism Withdrawn"
 notification_notification_kog_secularism_denounced_removed_desc: "Improvements in our standings with the Patriarch have resulted in the condemnation of our state being voided."
 notification_notification_kog_deposition_declined_name: "Patriarchal Deposition Declined"
 notification_notification_kog_deposition_declined_desc: "The #bold Sultan#! has declined our request to depose the Ecumenical Patriarch."
 notification_notification_kog_lex_animata_lost_name: "Blessing of the Lex Animata Withdrawn"
 notification_notification_kog_lex_animata_lost_desc: "Given our recent legal reforms, the clergy have agreed that the state can no longer claim to be the holy purveyors of theological wisdom. As a result, we have lost the [concept_timed_modifier] #bold Nómos Émpsychos#!."
 
 # Objectives
 objective_kog: "The Kingdom of God"
 objective_kog_desc: ""#italic We believe in one God, the Father almighty, maker of all things visible and invisible; And in one Lord, Jesus Christ, the Son of God, begotten from the Father, only-begotten...#!\n\n Lead the Christian community into the dawning age of metal and steel. Hold fast to the traditions of old or charge bravely into this new world!"

 objective_kog_name_PAP: "#v Papal States#!"
 objective_kog_desc_PAP: "#lore The Papal State is the collection of lands under the rule of Bishop of Rome, the Pope of the Catholic Church. Fresh off a popular revolt, the Papal administration struggles to fend off anti-clerical and nationalist movements.#!"
 objective_kog_name_FRA: "#v $FRA$#!"
 objective_kog_desc_FRA: "#lore Following decades of turmoil, the Concordat of 1801 restored order between the church and the state. However, tensions have arisen anew as the vocational missions of the church begin begin to assert against the absolutist powers of the Bourbon monarchs.#!"
 objective_kog_name_RUS: "#v $RUS$#!"
 objective_kog_desc_RUS: "#lore Since the reforms of Peter the Great, the Most Holy Synod has ensured state control over the Russian Orthodoxy. Under the tutelag of the czars, the church serves as little more than an extension of imperial authority.#!"
 objective_kog_name_GRE: "#v Greece has recently gained its independence from the Ottoman Empire. In a bid to insulate the young nation from Turkish meddling, the young King Otto has unilaterally severed communion with the Ecumenical Patriarchate.$GRE$#!"
 objective_kog_desc_GRE: "#lore #!"
 objective_kog_name_ALK: "#v $ALK$#!"
 objective_kog_desc_ALK: "#lore Following in the footsteps of the Priest Ivan Veniaminov, Russian missionaries have spread across the Alaskan coasts seekins to education and baptize all that they find.#!"
 objective_kog_name_SHW: "#v $SHW$#!"
 objective_kog_desc_SHW: "#lore In isolation from the Christian world, the Church in Ethiopia has fragmented along with the Ethiopian Empire. In Shewa, the King Sehla Selassie has asserted state control over the priesthood in his lands in defiance of the nominal authority of the Emperor.#!"
