 kog_holy_site_events.002.t: "The Capture of the Great Mosque"
 kog_holy_site_events.002.d: "Our righteous crusades against the Saracens have brought their jewel, the heathen city of Mecca, into our grasp."
 kog_holy_site_events.002.f: "One by one, rank after rank of Byzantine soldiers advanced into the city. There we beheld the Great Mosque, and at its heart the pagan relic, the al-Ḥajaru al-Aswad... the #black Black Stone#!."
 kog_holy_site_events.002.a: "We bring no peace. Burn it all down."
 kog_holy_site_events.002.b: "We will turn it into a museum."
 kog_holy_site_events.002.c: "The Saracens kept peace in Jerusalem. We will keep peace in Mecca."
