l_english:
 kog_council_events.000.t: "Convoking an Ecumenical Council"
 kog_council_events.000.d: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant] have called for an [concept_ecumenical_council], claiming there are grave issues within the Church that must be addressed."
 kog_council_events.001.f: "Typically called at the behest of the $kog_pope$, ecumenical councils have long been the primary method of resolving issues regarding the doctrine and administration of the Church."
 kog_council_events.002.f: "Ecumenical councils have long been the primary method of resolving issues regarding the doctrine and administration of the Church. Since the split with Rome, the Eastern Councils have primarily taken place in Constantinople, far from the overbearing influence of the Pope."
 kog_council_events.010.f: ""
 kog_council_events.000.a: "We should reconsider such action..."
 kog_council_events.000.1: "Raise $kog_canon_lawgroup_apostolic_succession$ as a [concept_matter_of_debate]."
 kog_council_events.000.2: "Raise $kog_canon_lawgroup_almsgiving$ as a [concept_matter_of_debate]."
 kog_council_events.000.3: "Raise $kog_canon_lawgroup_statism$ as a [concept_matter_of_debate]."
 kog_council_events.000.4: "Raise $kog_canon_lawgroup_nationalism$ as a [concept_matter_of_debate]."
 kog_council_events.000.5: "Raise $kog_canon_lawgroup_iconography$ as a [concept_matter_of_debate]."
 kog_council_events.000.6: "Raise $kog_canon_lawgroup_clerical_marriage$ as a [concept_matter_of_debate]."
 kog_council_events.000.7: "Raise $kog_canon_lawgroup_social_role$ as a [concept_matter_of_debate]."
 kog_council_events.000.8: "Raise $kog_canon_lawgroup_stance_on_sciences$ as a [concept_matter_of_debate]."
 kog_council_events.000.9: "Raise $kog_canon_lawgroup_crusades$ as a [concept_matter_of_debate]."
 
 kog_council_events.020.t: "Ecumenical Council Convoked"
 kog_council_events.020.d: "The Clergy of the $kog_devout$ have called for an [concept_ecumenical_council], ostensibly to address some \"grave\" matter confronting the church. They have issued an invitation for all important Bishops and Metropolitans to attend."
 kog_council_events.020.f: ""
 kog_council_events.020.a: "Our bishops will attend."
 kog_council_events.020.b: "Bar our priests from attending."