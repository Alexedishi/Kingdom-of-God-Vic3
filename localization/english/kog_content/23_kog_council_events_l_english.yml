 kog_council_events.100.t: "Ecumenical Council Convoked"
 kog_council_events.100.d: "The Clergy of [GetGlobalVariable('kog_orthodox_host_var').GetName] have called for an Ecumenical Council, ostensibly to address some \"grave\" matter confronting the church. They have issued an invitation for all important Bishops and Metropolitans to attend."
 kog_council_events.100.f: ""
 kog_council_events.100.a: "Our bishops will attend."
 kog_council_events.100.b: "Bar our priests from attending."