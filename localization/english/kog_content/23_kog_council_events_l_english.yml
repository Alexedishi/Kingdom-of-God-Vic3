 kog_council_events.001.t: "Convoking an Ecumenical Council"
 kog_council_events.001.d: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant] have called for an [concept_ecumenical_council], claiming there are grave issues within the Church that must be addressed."
 kog_council_events.001.f: "Typically called at the behest of the $kog_pope$, ecumenical councils have long been the primary method of resolving issues regarding the doctrine and administration of the Church."
 kog_council_events.001.a: "We should reconsider such action..."
 kog_council_events.001.1: "Raise $kog_canon_lawgroup_apostolic_succession$ as a [concept_matter_of_debate]."
 kog_council_events.001.2: "Raise $kog_canon_lawgroup_almsgiving$ as a [concept_matter_of_debate]."
 kog_council_events.001.3: "Raise $kog_canon_lawgroup_statism$ as a [concept_matter_of_debate]."
 kog_council_events.001.4: "Raise $kog_canon_lawgroup_nationalism$ as a [concept_matter_of_debate]."
 kog_council_events.001.5: "Raise $kog_canon_lawgroup_iconography$ as a [concept_matter_of_debate]."
 kog_council_events.001.6: "Raise $kog_canon_lawgroup_clerical_marriage$ as a [concept_matter_of_debate]."
 kog_council_events.001.7: "Raise $kog_canon_lawgroup_social_role$ as a [concept_matter_of_debate]."
 kog_council_events.001.8: "Raise $kog_canon_lawgroup_stance_on_sciences$ as a [concept_matter_of_debate]."
 kog_council_events.001.9: "Raise $kog_canon_lawgroup_crusades$ as a [concept_matter_of_debate]."
 
 kog_council_events.002.t: "Convoking an Ecumenical Council"
 kog_council_events.002.d: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant] have called for an [concept_ecumenical_council], claiming there are grave issues within the Church that must be addressed."
 kog_council_events.002.f: "Ecumenical councils have long been the primary method of resolving issues regarding the doctrine and administration of the Church. Since the split with Rome, the Eastern Councils have primarily taken place in Constantinople, far from the overbearing influence of the Pope."
 kog_council_events.002.a: "We should reconsider such action..."
 kog_council_events.002.1: "Raise $kog_canon_lawgroup_apostolic_succession$ as a [concept_matter_of_debate]."
 kog_council_events.002.2: "Raise $kog_canon_lawgroup_almsgiving$ as a [concept_matter_of_debate]."
 kog_council_events.002.3: "Raise $kog_canon_lawgroup_statism$ as a [concept_matter_of_debate]."
 kog_council_events.002.4: "Raise $kog_canon_lawgroup_nationalism$ as a [concept_matter_of_debate]."
 kog_council_events.002.5: "Raise $kog_canon_lawgroup_iconography$ as a [concept_matter_of_debate]."
 kog_council_events.002.6: "Raise $kog_canon_lawgroup_clerical_marriage$ as a [concept_matter_of_debate]."
 kog_council_events.002.7: "Raise $kog_canon_lawgroup_social_role$ as a [concept_matter_of_debate]."
 kog_council_events.002.8: "Raise $kog_canon_lawgroup_stance_on_sciences$ as a [concept_matter_of_debate]."
 kog_council_events.002.9: "Raise $kog_canon_lawgroup_crusades$ as a [concept_matter_of_debate]."
 
