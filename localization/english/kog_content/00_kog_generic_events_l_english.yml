l_english:
 kog_generic_events.001.t: "Bible Translation Published"
 kog_generic_events.001.d: "The faithful in [SCOPE.sState('kog_event_state').GetName] are in an uproar over a plan by the [SCOPE.gsInterestGroup('intelligentsia_scope').GetName] to publish a translation of the Holy Book in Common [ROOT.GetCountry.GetAdjectiveNoFormatting]."
 kog_generic_events.001.f: ""Who amongst the peasants and the workers, who even among the merchants and the clerks and all those who have not completed secondary education can understand the language of the Gospels? No one." -Akropolis, published 9 September 1901"
 kog_generic_events.001.a: "Let the faithful read!"
 kog_generic_events.001.b: "This is an insult to the divine word!"
 kog_generic_events.002.t: "A Heretical Ruler"
 kog_generic_events.002.d: "[ROOT.GetCountry.GetName] is an [GetReligion('orthodox').GetName] nation, yet [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] follows the [ROOT.GetCountry.GetRuler.GetReligion.GetName] faith. Vocal church leaders have suggesting that it is high time the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] put the good of the nation before his personal matters and join the church."
 kog_generic_events.002.f: "The Eastern Orthodox Church has held sway over the Balkans and Asia Minor since the time of the Romans. However, in the intervening centuries, both Catholicism and Protestantism have risen in the West. This has clashed with local nations who have found themselves led by non-Orthodox sovereigns imposed upon them by the Great Powers."
 kog_generic_events.002.a: "The royal family will join the Church."
 kog_generic_events.002.b: "We will compromise with the heir, [SCOPE.sCharacter('kog_heir_scope').GetFirstName]."
 kog_generic_events.002.c: "This is nonsense!"
 kog_generic_events.003.t: "Ecumenical Reform"
 kog_generic_events.003.d: "The Eastern Orthodox Church is the one true successor to the Great Church founded by Jesus Christ. Yet, with its decentralized structure, deviations have developed between the various churches over the centuries. A cohort of bishops have requested state support in implementing some liturgical changes in the interest of better aligning ourselves with the rest of the Orthodox family."
 kog_generic_events.003.f: "With the ebb and flow of Patriarchal influence over the church at large, minor differences have developed within the Orthodox church that have often led to minor schisms. While this may upset more traditionalist segements of the clergy, many argue that the Church structure is as much at risk of disintegration as that of the Sultan."
 kog_generic_events.003.a: "They will have state backing."
 kog_generic_events.003.b: "We will not abandon our traditions."
 kog_generic_events.003.tt: "#red This will impede any attempts to #bold Reform the Synod#! for several years.#!"
 kog_generic_events.004.t: "Monastic Reparations"
 kog_generic_events.004.d: "In the years since the seizure of monastic lands by the state, leaders from the [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant] have petitioned the government to replace the lost of their subsistence lands."
 kog_generic_events.004.f: "With their massive estates, the monasteries were able to provide for themselves in a manner completely independent of the state. Without these lands, the number of functioning monasteries has dwindled as the clergy are forced to seek gainful employment."
 kog_generic_events.004.a: "The state cannot afford them benefits."
 kog_generic_events.004.b: "We should show mercy."
 kog_generic_events.005.t: "Church-State Relations"
 kog_generic_events.005.d: "While the Church of [ROOT.GetCountry.GetName] has been a vital pillar of our cultural identity, senior clergymen have suggested that the inclusion of state-appointed priests is diluting the holiness of the Church."
 kog_generic_events.005.f: "Historical Note: Dating back to Byzantine times, many positions within Church leadership were appointed by the state. This practice was additionally normalized under both Turkish and Russian rule. However, this practice often risked damaging the credibility of the clergy and kept the Church open to political meddling."
 kog_generic_events.005.a: "Let the Church be."
 kog_generic_events.005.b: "The State will have primacy."