 kog_canon_lawgroup_clerical_marriage_desc: ""
 
 kog_canon_law_priests_celibate: "@kog_canon_law_priests_celibate! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_priests_celibate_desc')] Clerical Celibacy#!#!#!"
