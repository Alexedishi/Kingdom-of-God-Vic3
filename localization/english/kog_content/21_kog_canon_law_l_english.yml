l_english:
 ## Canon Laws
 kog_canon_law_none: "@kog_canon_law_none! #bold None#!"
 kog_canon_law_temp: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_temp_desc')]#!#!#!"
 kog_canon_law_temp_desc: "#filler kog_canon_law_temp_desc#!"
 kog_canon_law_modifier: "Adopting this [concept_canon_law] will confer the following effects (modified by [concept_canon_law_compliance]):\n"
 
 ####---------- Apostolic Succession ----------####
 kog_canon_lawgroup_apostolic_succession: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_lawgroup_apostolic_succession_desc')] Apostolic Succession#!#!#!"
 kog_canon_lawgroup_apostolic_succession_desc: "#bold Apostolic Succession#! is the belief by which a church traces the transmission of grace and ministerial authority from the disciples of Christ to the modern day. More ancient denominations, such as the [GetReligion('catholic').GetName] and [GetReligion('orthodox').GetName] Churches, assert that the consecration of Bishops by other Bishops is the only way to maintain the validity of priestly orders, while many [GetReligion('protestant').GetName] denominations assert this continuity is unnecessary and rooting in fundamental misunderstandings of scripture."
 
 kog_canon_law_papal_primacy: "@kog_canon_law_papal_primacy! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_papal_primacy_desc')] Papal Primacy#!#!#!"
 kog_canon_law_papal_primacy_desc: "$kog_canon_law_papal_primacy_flavor$$com_ttdl$$kog_canon_law_papal_primacy_modifier$"
 kog_canon_law_papal_primacy_flavor: "A single Bishop is elevated above the all others and wields sovereign and absolute authority over all other Bishops. In such a system, deviation from the mother church is tantamount to [concept_schism]."
 kog_canon_law_papal_primacy_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_papal_primacy').GetDesc]"
 
 kog_canon_law_synodality: "@kog_canon_law_synodality! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_synodality_desc')] Synodality#!#!#!"
 kog_canon_law_synodality_desc: "$kog_canon_law_synodality_flavor$$com_ttdl$$kog_canon_law_synodality_modifier$"
 kog_canon_law_synodality_flavor: "Churches are lead by group of elected bishops who cooperate in administering the church. While specific Bishops may be recognized as more senior or prestigious, no church hold authority over any other."
 kog_canon_law_synodality_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_synodality').GetDesc]"
 
 kog_canon_law_congregationalism: "@kog_canon_law_congregationalism! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_congregationalism_desc')] Congregationalism#!#!#!"
 kog_canon_law_congregationalism_desc: "$kog_canon_law_congregationalism_flavor$$com_ttdl$$kog_canon_law_congregationalism_modifier$"
 kog_canon_law_congregationalism_flavor: "Every local church, or congregation, operates with full independence as has full rights to interpret and preach scripture. In such a system, any central authority is hypothetical at best and fundamental theological disagreements are commonplace."
 kog_canon_law_congregationalism_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_congregationalism').GetDesc]"
 
 ####---------- Almsgiving ----------####
 kog_canon_lawgroup_almsgiving: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_lawgroup_almsgiving_desc')] Almsgiving#!#!#!"
 kog_canon_lawgroup_almsgiving_desc: "#bold Almsgiving#! has formed a foundational aspect of the church. With no inherent industrial or productive elements, the church survives by its ability to collect money from its parishioners or from the state. While the ancient churches are often tied into taxation systems and state funding, many [GetReligion('protestant').GetName] churches mandate direct contributions from the faithful."
 
 kog_canon_law_no_alms: "@kog_canon_law_no_alms! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_no_alms_desc')] No Alms#!#!#!"
 kog_canon_law_no_alms_desc: "$kog_canon_law_no_alms_flavor$$com_ttdl$$kog_canon_law_no_alms_modifier$"
 kog_canon_law_no_alms_flavor: ""
 kog_canon_law_no_alms_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_no_alms').GetDesc]"
 
 kog_canon_law_offertory: "@kog_canon_law_offertory! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_offertory_desc')] Offertory#!#!#!"
 kog_canon_law_offertory_desc: "$kog_canon_law_offertory_flavor$$com_ttdl$$kog_canon_law_offertory_modifier$"
 kog_canon_law_offertory_flavor: ""
 kog_canon_law_offertory_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_offertory').GetDesc]"
 
