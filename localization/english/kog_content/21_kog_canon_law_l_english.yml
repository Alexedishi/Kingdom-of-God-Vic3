 ####---------- Iconography ----------####
 kog_canon_lawgroup_iconography: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_lawgroup_iconography_desc')] Iconography#!#!#!"
 kog_canon_lawgroup_iconography_desc: "Christianity has inherited a deep #bold Iconographic Tradition# from the Greco-Roman world it was born in to. The theological implications of the creation and veneration of representations of the divine have long been source of deep conflict within Christendom. The ancient churches often favor elaborate iconography and architecture, while [GetReligion('protestant').GetName] churches range from simplified artistic traditions to outright bans on lavish displays in places of worship."
 
