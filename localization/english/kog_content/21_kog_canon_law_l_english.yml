 kog_canon_law_marriage_allowed_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_marriage_allowed').GetDesc]"
 
 ####---------- Social Role ----------####
 kog_canon_lawgroup_social_role: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_lawgroup_social_role_desc')] Social Role#!#!#!"
 kog_canon_lawgroup_social_role_desc: "The #bold Social Role#! of the church guides the methodology by which the church engages with society. In more conservative churches, the clergy will act to uphold the "traditional values of society," while more activist churches will aim to fight for the well-being of society, even when it brings the clergy into conflict with entrenched interests."
 
 kog_canon_law_moral_authority: "@kog_canon_law_moral_authority! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_moral_authority_desc')] Moral Authority#!#!#!"
 kog_canon_law_moral_authority_desc: "$kog_canon_law_moral_authority_flavor$$com_ttdl$$kog_canon_law_moral_authority_modifier$
 kog_canon_law_moral_authority_flavor: "The clergy are not only the foundation of society, but their interpretation of what is moral behavior and not is considered essential in society, regardless of any impingement personal freedoms."
 kog_canon_law_moral_authority_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_moral_authority').GetDesc]""
 
 kog_canon_law_moral_guidance: "@kog_canon_law_moral_guidance! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_moral_guidance_desc')] Moral Guidance#!#!#!"
 kog_canon_law_moral_guidance_desc: "$kog_canon_law_moral_guidance_flavor$$com_ttdl$$kog_canon_law_moral_guidance_modifier$"
 kog_canon_law_moral_guidance_flavor: "The clergy are expected to provide social counsel and live as beacons of morality. However, they are limited their ability to interfere in personal affairs."
 kog_canon_law_moral_guidance_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_moral_guidance').GetDesc]"
 
 kog_canon_law_social_activism: "@kog_canon_law_social_activism! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_social_activism_desc')] Social Activism#!#!#!"
 kog_canon_law_social_activism_desc: "$kog_canon_law_social_activism_flavor$$com_ttdl$$kog_canon_law_social_activism_modifier$"
 kog_canon_law_social_activism_flavor: "The clergy encourage the laity to engage in social causes, such as tolerance of minorities or the rights of women, both during liturgy and in their role as social counsel."
 kog_canon_law_social_activism_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_social_activism').GetDesc]"
 
 kog_canon_law_modernizing_force: "@kog_canon_law_modernizing_force! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_modernizing_force_desc')] Modernizing Force#!#!#!"
 kog_canon_law_modernizing_force_desc: "$kog_canon_law_modernizing_force_flavor$$com_ttdl$$kog_canon_law_modernizing_force_modifier$"
 kog_canon_law_modernizing_force_flavor: "The clergy are commanded to directly engage in social causes, directly participating in marches and strikes, even when this puts them at risk of person harm or the church at risk of retaliation."
 kog_canon_law_modernizing_force_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_modernizing_force').GetDesc]"
 
 ####---------- Stance on Sciences ----------####
 kog_canon_lawgroup_stance_on_sciences: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_lawgroup_stance_on_sciences_desc')] Stance on the Sciences#!#!#!"
 kog_canon_lawgroup_stance_on_sciences_desc: "Christianity has a complicated relationship with the church, ranging from promoting scientific innovation to resisting findings that contradict scripture. A church's #bold Stance on the Sciences#! provides the framework by which the church administration interacts with innovation and discovery."
 
 kog_canon_law_scriptural_supremacy: "@kog_canon_law_scriptural_supremacy! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_scriptural_supremacy_desc')] Scriptural Supremacy#!#!#!"
 kog_canon_law_scriptural_supremacy_desc: "$kog_canon_law_scriptural_supremacy_flavor$$com_ttdl$$kog_canon_law_scriptural_supremacy_modifier$"
 kog_canon_law_scriptural_supremacy_flavor: "The church holds that the only truth is that which can be gleaned from scripture. Any contradiction with scripture is condemned as heresy and, where possible, prosecuted as criminal."
 kog_canon_law_scriptural_supremacy_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_scriptural_supremacy').GetDesc]"
 
 kog_canon_law_scriptural_favoritism: "@kog_canon_law_scriptural_favoritism! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_scriptural_favoritism_desc')] Scriptural Favoritism#!#!#!"
 kog_canon_law_scriptural_favoritism_desc: "$kog_canon_law_scriptural_favoritism_flavor$$com_ttdl$$kog_canon_law_scriptural_favoritism_modifier$"
 kog_canon_law_scriptural_favoritism_flavor: "The church favors rationalizing scientific discoveries with the scripture. While not denying the validity of scientific findings, the church asserts many phenomena to be divine in nature."
 kog_canon_law_scriptural_favoritism_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_scriptural_favoritism').GetDesc]"
 
 kog_canon_law_scientific_disengagement: "@kog_canon_law_scientific_disengagement! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_scientific_disengagement_desc')] Scientific Disengagement#!#!#!"
 kog_canon_law_scientific_disengagement_desc: "$kog_canon_law_scientific_disengagement_flavor$$com_ttdl$$kog_canon_law_scientific_disengagement_modifier$"
 kog_canon_law_scientific_disengagement_flavor: "The church takes no particular stance on the sciences and hold no specific stances on the validity or merit of scientific discovery."
 kog_canon_law_scientific_disengagement_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_scientific_disengagement').GetDesc]"
 
 kog_canon_law_scientific_patronage: "@kog_canon_law_scientific_patronage! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_scientific_patronage_desc')] Scientific Patronage#!#!#!"
 kog_canon_law_scientific_patronage_desc: "$kog_canon_law_scientific_patronage_flavor$$com_ttdl$$kog_canon_law_scientific_patronage_modifier$"
 kog_canon_law_scientific_patronage_flavor: "The church takes an active role in promoting the sciences, by patronizing academic institutions and funding private initiatives."
 kog_canon_law_scientific_patronage_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_scientific_patronage').GetDesc]"
 
 kog_canon_law_scientific_crusade: "@kog_canon_law_scientific_crusade! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_scientific_crusade_desc')] Scientific Crusade#!#!#!"
 kog_canon_law_scientific_crusade_desc: "$kog_canon_law_scientific_crusade_flavor$$com_ttdl$$kog_canon_law_scientific_crusade_modifier$"
 kog_canon_law_scientific_crusade_flavor: "The church is committed to the cause of scientific discovery, with the clergy preaching innovation as the means to understand the mystery of God's creation."
 kog_canon_law_scientific_crusade_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_scientific_crusade').GetDesc]"
 
 ####---------- Crusades ----------####
 kog_canon_lawgroup_crusades: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_lawgroup_crusades_desc')] Crusades#!#!#!"
 kog_canon_lawgroup_crusades_desc: ""
 
 kog_canon_law_no_crusades: "@kog_canon_law_no_crusades! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_no_crusades_desc')] No Crusades#!#!#!"
 kog_canon_law_no_crusades_desc: "$kog_canon_law_no_crusades_flavor$$com_ttdl$$kog_canon_law_no_crusades_modifier$"
 kog_canon_law_no_crusades_flavor: "The church holds that crusades are a relic of a bygone era and unfit as a theological justification for conflict."
 kog_canon_law_no_crusades_modifier: "$kog_canon_law_modifier$[GetStaticModifier('modifier_kog_canon_law_no_crusades').GetDesc]"
 
 kog_canon_law_heathen_crusades: "@kog_canon_law_heathen_crusades! #bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_heathen_crusades_desc')] Crusades Against Heathens#!#!#!"
 kog_canon_law_heathen_crusades_desc: "$kog_canon_law_heathen_crusades_flavor$$com_ttdl$$kog_canon_law_heathen_crusades_modifier$"
 kog_canon_law_heathen_crusades_flavor: "The church holds that crusades are justified as a means of uniting Christendom in spreading the Word of God to those that have either rejected evangelization or have yet to hear the Word."
