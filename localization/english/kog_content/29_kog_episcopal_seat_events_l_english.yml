 kog_episcopal_events.190.t: "Seat Integration Disputed"
 kog_episcopal_events.190.d: "The unilateral move by [SCOPE.sCountry('kog_integrator_scope').GetName] to realign one of the patriarchal seats to their control has provoked outrage amongst the clergy. Many of our bishops have petitioned the government for a strong response, arguing that any assertion of control a [concept_episcopal_seat] directly threatens our [concept_autocephaly]."
 kog_episcopal_events.190.f: "Since the fall of Constantinople, the Orthodox churches, especially under Ottoman rule, have enjoyed relative independence from direct state administration. Any attempt to directly subordinate the church to political administration is bound to draw detractors."
 kog_episcopal_events.190.a: "We will support their claim."
 kog_episcopal_events.190.b: "This goes against the order of things."
 kog_episcopal_events.191.t: "Seat Integration Disputed"
 kog_episcopal_events.191.d1: "Despite our legitimate rights to exercise control over the faith, [SCOPE.sCountry('kog_disputer_scope').GetName] has disputed our rights to integrate the [concept_episcopal_seat]."
 kog_episcopal_events.191.d2: "In a surprising turn of events, [SCOPE.sCountry('kog_disputer_scope').GetName] has endorsed our intent to integrate a [concept_episcopal_seat] into our ecclesiastic administration."
 kog_episcopal_events.191.f: "For centuries the ecclesiastic structure has remained inflexible, contributing it its slow decay under the Ottoman rule. In taking a fragment of the church under our care, we have the chance to reinvigorate the faith."
 kog_episcopal_events.191.a: "Our Metropolitan will not back down."
 kog_episcopal_events.191.b: "Perhaps we should listen to our Patriarchs..."
 kog_episcopal_events.191.c: "Wonderful News!"