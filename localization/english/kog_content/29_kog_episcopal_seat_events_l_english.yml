 kog_episcopal_events.181.t: "State Authority Asserted Over $kog_constantinople$"
 kog_episcopal_events.181.d: "Having seized control of the city of Constantinople, [ROOT.GetCountry.GetName] has claimed direct control over the ecclesiastic apparatus of the Ecumenical Patriarchate."
 kog_episcopal_events.181.f: "The Queen of Cities, Constantinople itself serves as the beating heart of the Eastern Orthodoxy. To challenge control of this seat to assert dominance over the faith as a whole."
 kog_episcopal_events.181.a: "Constantinople, the jewel of the East, belongs to us."
