l_english:
 kog_episcopal_events.100.t: "Control Secured Over $kog_rome$"
 kog_episcopal_events.100.d: "Our bishops have secured control of the seat of $kog_rome$. All bishops still loyal to [SCOPE.sCountry(kog_rome_controller_scope).GetName] have been removed from high offices and relegated to ceremonial roles or forced into retirement."
 kog_episcopal_events.100.f: "To challenge $kog_control$ of any seat is to assert dominance over the [ROOT.GetCountry.GetStateReligion.GetName] faith as a whole. This will be seen as a breach of divine order."
 kog_episcopal_events.100.a: "$kog_rome$ will be safe with [ROOT.GetCountry.GetName]."
