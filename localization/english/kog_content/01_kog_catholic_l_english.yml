 je_kog_ecyclical_mirari_vos: "$kog_encyclical$: #italic Mirari Vos#!"
 je_kog_ecyclical_mirari_vos_reason: "#italic To All Patriarchs, Primates, Archbishops, and Bishops of the Catholic World...#!\n\nWhile Napoleon's empire has been dismantled, his actions have energized the emergence of Nationalism and Secularism across Europe. Meanwhile, in the wake of religious reform in France, Catholic priest, Félicité de La Mennais, has ignited controversy by arguing that liberal reform runs little risk of steering the church towards $kog_canon_law_gallicanism$ or $kog_canon_law_constantinianism$. The Pope has wasted little time issuing #bold #italic Mirari Vos#!#! and condemning this line of thinking.$kog_linebreak$ #white The Holy See expects compliance with its dictates. This [concept_encyclical] stipulates that involved countries maintain the following:$_nlbp$"
 je_kog_ecyclical_mirari_vos_success_effect: ""
 je_kog_ecyclical_mirari_vos_failure_effect: ""
 je_kog_ecyclical_mirari_vos_tt: "The Papacy has commanded that the faith abide by the @kog_catholic! $kog_encyclical$ #italic Mirari Vos#!"
 
 je_kog_ecyclical_singulari_nos: "$kog_encyclical$: #italic Singulari Nos#!"
 je_kog_ecyclical_singulari_nos_reason: "#italic \"We have learned of the pamphlet written in French under the title Paroles d'un croyant, for it has been printed by this man and disseminated everywhere.... Though small in size, it is enormous in wickedness.... Once the torch of treason is ignited everywhere, it ruins public order, fosters contempt of government, and stimulates lawlessness.\"#!\nIn reply to #italic Mirari Vos#!, Father de La Mennais has published a scathing response in #italic Paroles d'un croyant#!. In this, he has denounced both the church and civil authorities. The Pope has responded with #italic Singulari Nos#! which calls on the faithful to reject the modernizing forces of the world."
 je_kog_ecyclical_singulari_nos_success_effect: ""
 je_kog_ecyclical_singulari_nos_failure_effect: ""
 je_kog_ecyclical_singulari_nos_tt: "The Papacy has commanded that the faith abide by the @kog_catholic! $kog_encyclical$ #italic Singulari Nos#!"
 
