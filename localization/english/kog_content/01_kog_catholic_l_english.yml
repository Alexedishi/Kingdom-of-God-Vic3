 kog_catholic_events.001.d.PAP: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] sits at the head of a crumbling edifice. Recently restored to power by the $glossary_congress_of_vienna$, [ROOT.GetCountry.GetRuler.GetFullName] presides over a reconstituted clerical government in the [ROOT.GetCountry.GetNameNoFlag]. Popular resistance abounds as Italian nationalism, inflamed by the French occupation, has resulted in both protests and revolts against Papal rule.$com_lb$Across the worldwide church, liberal thought gnaws that the authority of the clergy. In [GetGeographicRegion('geographic_region_europe').GetName], nations seek to regulate church authority and expunge their influence over the state. In the [GetGeographicRegion('geographic_region_americas').GetName], Catholicism is threatened by the aggressive expansion of [GetReligion('protestant').GetName] movements, while the faith syncretizes with native traditions of Central and South America, far from the reach of Rome. In the [GetGeographicRegion('geographic_region_balkans').GetName] and [GetGeographicRegion('geographic_region_kog_orient').GetName], Catholics face increased pressures from the crumbling Muslim empires and their increasingly autonomous [GetReligion('orthodox').GetName] subjects.$com_lb$Within Papacy's temporal holdings, the populace protests the brazen corruption of the clergy. An uprising in 1830 saw the Italian tricolor raised in all Papal Legations, and it was only through timely Austrian intervention that Papal authority survived. Despite this, the Papacy has maintained a reactionary stance, going as far as condemning any attempts at liberal reforms."
