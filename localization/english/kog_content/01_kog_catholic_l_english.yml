l_english:
 # Journal Entries
 je_kog_catholic: "The [GetReligion('catholic').GetName] Church"
 je_kog_catholic_reason: "#filler je_kog_catholic_reason#!"
 je_kog_catholic_lobby: "#todo je_kog_catholic_lobby"
 
 je_kog_encyclical_cum_primum: "$kog_encyclical$: #italic Cum Primum#!"
 je_kog_encyclical_cum_primum_reason: "#italic \"When the first report of the calamities, which so seriously devastated your flourishing kingdom reached our ears, We learned simultaneously that they had been caused by some fabricators of deceit and lies. Under the pretext of religion, and revolting against the legitimate authority of the princes, they filled their fatherland, which they loosed from due obedience to authority, with mourning.\"#!\n\n--$com_ttdl$#white The Holy See expects compliance with its dictates. This [concept_encyclical] stipulates that [JournalEntry.Var('kog_congress_poland_scope').GetCountry.GetNameNoFlag] abide by the following:\n[GetScriptedGui('kog_encyclical_cum_primum_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 je_kog_encyclical_cum_primum_status: "[GetPlayer.GetCustom('je_kog_encyclical_cum_primum_type')]"
 je_kog_encyclical_cum_primum_criterion_1: "[GetGlobalVariable('je_kog_encyclical_cum_primum').Var('kog_congress_poland_scope').GetCountry.GetNameNoFlag] is a [concept_subject]"
 je_kog_encyclical_cum_primum_criterion_2: "[GetGlobalVariable('je_kog_encyclical_cum_primum').Var('kog_congress_poland_scope').GetCountry.GetNameNoFlag] is #bold not#! at [concept_war] with its [concept_overlord]"
 je_kog_encyclical_cum_primum_criterion_3: "[GetGlobalVariable('je_kog_encyclical_cum_primum').Var('kog_congress_poland_scope').GetCountry.GetNameNoFlag] has relations of #green #bold cordial#!#! or better with its [concept_overlord]"
 je_kog_encyclical_cum_primum_success_effect: ""
 je_kog_encyclical_cum_primum_failure_effect: ""
 je_kog_encyclical_cum_primum_compliant: "[GetGlobalVariable('je_kog_encyclical_cum_primum').Var('kog_congress_poland_scope').GetCountry.GetNameNoFlag] is #bold #green compliant#!#! with this [concept_encyclical]"
 je_kog_encyclical_cum_primum_noncompliant: "[GetGlobalVariable('je_kog_encyclical_cum_primum').Var('kog_congress_poland_scope').GetCountry.GetNameNoFlag] is #bold #red not compliant#!#! with this [concept_encyclical]"
 je_kog_encyclical_cum_primum_tt: "The $kog_papacy$ has commanded that [GetGlobalVariable('je_kog_encyclical_cum_primum').Var('kog_congress_poland_scope').GetCountry.GetNameNoFlag] abide by @kog_catholic! #bold #italic Cum Primum#!#!"
 
 je_kog_ecyclical_mirari_vos: "$kog_encyclical$: #italic Mirari Vos#!"
 je_kog_ecyclical_mirari_vos_reason: "#italic To All Patriarchs, Primates, Archbishops, and Bishops of the Catholic World...#!\n\nWhile Napoleon's empire has been dismantled, his actions have energized the emergence of Nationalism and Secularism across Europe. Meanwhile, in the wake of religious reform in France, Catholic priest, Félicité de La Mennais, has ignited controversy by arguing that liberal reform runs little risk of steering the church towards $kog_canon_law_gallicanism$ or $kog_canon_law_constantinianism$. The Pope has wasted little time issuing #bold #italic Mirari Vos#!#! and condemning this line of thinking.$com_ttdl$#white The Holy See expects compliance with its dictates. This [concept_encyclical] stipulates that involved countries maintain the following:#!\n\n[GetScriptedGui('kog_ecyclical_mirari_vos_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 je_kog_ecyclical_mirari_vos_status: "[GetPlayer.GetCustom('je_kog_ecyclical_mirari_vos_type')]"
 je_kog_ecyclical_mirari_vos_criterion__1: "Have any variant of [GetLawType('law_state_religion').GetName] $kog_enacted$"
 je_kog_ecyclical_mirari_vos_criterion__2: "Have either [GetLawType('law_ecclesiastic_investiture').GetName] or [GetLawType('law_oath_of_supremacy').GetName] $kog_enacted$"
 je_kog_ecyclical_mirari_vos_success_effect: ""
 je_kog_ecyclical_mirari_vos_failure_effect: ""
 je_kog_ecyclical_mirari_vos_tt: "The $kog_papacy$ has commanded that the faith abide by @kog_catholic! #bold #italic Mirari Vos#!#!"
 
 je_kog_ecyclical_singulari_nos: "$kog_encyclical$: #italic Singulari Nos#!"
 je_kog_ecyclical_singulari_nos_reason: "#italic \"We have learned of the pamphlet written in French under the title#! Paroles d'un croyant#italic , for it has been printed by this man and disseminated everywhere.... Though small in size, it is enormous in wickedness.... Once the torch of treason is ignited everywhere, it ruins public order, fosters contempt of government, and stimulates lawlessness.\"#!\n\nIn reply to #italic Mirari Vos#!, Father de La Mennais has published a scathing response in #italic Paroles d'un croyant#!. In this, he has denounced both the church and civil authorities. The Pope has responded with #italic Singulari Nos#! which calls on the faithful to reject the modernizing forces of the world.$com_ttdl$#white The Holy See expects compliance with its dictates. This [concept_encyclical] stipulates that involved countries maintain #bold at least 3#! of the following:\n[GetScriptedGui('kog_ecyclical_singulari_nos_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 je_kog_ecyclical_singulari_nos_status: "[GetPlayer.GetCustom('je_kog_ecyclical_singulari_nos_type')]"
 je_kog_ecyclical_singulari_nos_criterion_1: "Have no form of $kog_voting_franchise$"
 je_kog_ecyclical_singulari_nos_criterion_2: "Have any variant of [GetLawType('law_subjecthood').GetName] $kog_enacted$"
 je_kog_ecyclical_singulari_nos_criterion_3: "Have any variant of [GetLawType('law_freedom_of_conscience').GetName] $kog_enacted$"
 je_kog_ecyclical_singulari_nos_criterion_4: "Have any variant of [GetLawType('law_religious_schools').GetName] $kog_enacted$"
 je_kog_ecyclical_singulari_nos_criterion_5: "Have any variant of either [GetLawType('law_censorship').GetName] or [GetLawType('law_outlawed_dissent').GetName] $kog_enacted$"
 je_kog_ecyclical_singulari_nos_success_effect: ""
 je_kog_ecyclical_singulari_nos_failure_effect: ""
 je_kog_ecyclical_singulari_nos_tt: "The $kog_papacy$ has commanded that the faith abide by @kog_catholic! #bold #italic Singulari Nos#!#!"
 
 je_kog_commissum_divinitus: "$kog_encyclical$: #italic Commissum Divinitus#!"
 je_kog_commissum_divinitus_reason: "#italic \"--\"#!\n\n--$com_ttdl$#white The Holy See expects compliance with its dictates. This [concept_encyclical] stipulates that [JournalEntry.MakeScope.Var('kog_switzerland_scope').GetCountry.GetNameNoFlag] abide by the following:\n[GetScriptedGui('kog_encyclical_commissum_divinitus_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 je_kog_commissum_divinitus_status: "[GetReligion('catholic').GetName] $kog_radicalism$ is at [GetGlobalVariable('je_kog_commissum_divinitus').Var('kog_swiss_catholic_radicalism_var').GetValue|-+%]"
 je_kog_commissum_divinitus_tt: "The $kog_papacy$ has commanded that [GetGlobalVariable('je_kog_commissum_divinitus').Var('kog_switzerland_scope').GetCountry.GetNameNoFlag] abide by @kog_catholic! #bold #italic Commissum Divinitus#!#!"
 
 je_kog_inter_praecipuas_machinationes: "$kog_encyclical$: #italic Inter Praecipuas Machinationes#!"
 je_kog_inter_praecipuas_machinationes_reason: ""
 je_kog_inter_praecipuas_machinationes_tt: "The $kog_papacy$ has commanded that the [GetReligion('catholic').GetName] faith abide by the @kog_catholic! $kog_encyclical$ #italic Inter Praecipuas Machinationes#!"
 
