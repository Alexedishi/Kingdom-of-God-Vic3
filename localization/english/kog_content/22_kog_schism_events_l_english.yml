l_english:
 kog_schism_events.001.t: "Declaration of Schism with [Country.MakeScope.Var('je_kog_local').Var('kog_mother_church_var').GetFlagName]"
 kog_schism_events.001.d: "In a breach of the old order, the Church of [ROOT.GetCountry.GetName] has broken communion with [Country.MakeScope.Var('je_kog_local').Var('kog_mother_church_var').GetFlagName] and declared their [concept_autocephaly]. As expected, [Country.MakeScope.Var('je_kog_local').Var('kog_mother_church_var').GetFlagName] has condemned our actions and threatened us with excommunication."
 kog_schism_events.001.f: ""
 kog_schism_events.001.a: "[ROOT.GetCountry.GetName] will take charge of its faithful."
 kog_schism_events.002.t: "Autocephaly of the National Church"
 kog_schism_events.002.d: "In the face of resistance by the Patriarchs, the church of [ROOT.GetCountry.GetName] has successfully separated its ecclesiastical administration from that of [Country.MakeScope.Var('je_kog_local').Var('kog_mother_church_var').GetFlagName]. Seeking to avoid further fractures within the church, -- has recognized our autonomy within the fabric of the church."
 kog_schism_events.002.f: "The only way to safeguard our cultural and identity as a [ROOT.GetCountry.GetAdjectiveNoFormatting] nation is to take control of our spiritual affairs, regardless of the complaints of the Ecclesiarchy."
 kog_schism_events.002.a: "We will defend our faith."
 
 kog_schism_events.010.t: "Traditionalists March in [ROOT.GetCountry.GetCapital.GetCityHubName]"
 kog_schism_events.010.d: "[GetReligion('orthodox').GetName] traditionalists have staged an enormous march in [ROOT.GetCountry.GetCapital.GetCityHubName] demanding that the state put an end the heresy of schism with Constantinople, or at least grant them "safeguards" against "state-sponsored nihilism"."
 kog_schism_events.010.f: "Amongst their many grievances they count matters such as deviation from a universal doctrine and the destruction of church tradition; yet, many are quick to forget the abuses of the Phanariotes."
 kog_schism_events.010.a: "The only future for [ROOT.GetCountry.GetName] is one free of Constantinople."
 kog_schism_events.010.b: "We cannot ignore the voices of the faithful."
 kog_schism_events.011.t: "A Church for the Nation"
 kog_schism_events.011.d: "As the Church of [ROOT.GetCountry.GetName] continues to disentangle itself from the ecclesiarchy of Constantinople, both bishops and scholars have questioned what the role of the church will be within the [ROOT.GetCountry.GetAdjectiveNoFormatting] state with many arguing that it should serve the cause of #yellow Nationalism#!."
 kog_schism_events.011.f: "In transforming the Church into something that is singularly [ROOT.GetCountry.GetAdjectiveNoFormatting], the state has the unique opportunity to leverage its influence over the fabric of society."
 kog_schism_events.011.a: "The Church will champion our national identity."
 kog_schism_events.011.b: "The clergy are best removed from societal affairs."
 kog_schism_events.012.t: "[SCOPE.sReligion('kog_minority_religion_scope').GetName] Adherents Seek Equality"
 kog_schism_events.012.d: "The withdrawal of our Church from the wider [GetReligion('orthodox').GetName] community has prompted concern among members of the [SCOPE.sReligion('kog_minority_religion_scope').GetName] population regarding the erosion of protections they enjoyed under the old regime. Community leaders have petitioned the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to endorse laws protecting them from discrimination."
 kog_schism_events.012.f: ""
 kog_schism_events.012.a: "They tolerated us in their time. We should return the favor."
 kog_schism_events.012.b: "[ROOT.GetCountry.GetNameNoFlag] is an [GetReligion('orthodox').GetName] nation first."
 kog_schism_events.013.t: "Patriarch Denounces Schism"
 kog_schism_events.013.d: "[SCOPE.sCharacter('kog_patriarch_event_scope').GetFirstName], the Patriarch of [SCOPE.GetRootScope.GetCountry.GetCustom('kog_seat_event_type')] has condemned the heresy of unilateral schism with Constantinople."
 kog_schism_events.013.f: "The unilateral severance of communion with the Ecumenical Patriarchate has not gone without controversy, as the Turk and Russian dominated church elders seek to avoid any threats to their legitimacy."
 kog_schism_events.013.a: "What does [SCOPE.sCharacter('kog_patriarch_event_scope').GetFirstName] know of our people?"
 kog_schism_events.013.b: "Perhaps we could assuage his concerns."
 kog_schism_events.014.t: "Liturgical Language"
 kog_schism_events.014.d: "[GetCulture('greek').GetName] Phanariot bishops in [ROOT.GetCountry.GetCapital.GetCityHubName] have caused an uproar by imposing Greek as the primary language in both school and religions. The church is the only means by which our [SCOPE.sCulture('kog_primary_culture_scope').GetName] language has survived Ottoman domination. Should they have their way, the very idea of a [SCOPE.sCulture('kog_primary_culture_scope').GetName] state may be swept to the wind."
 kog_schism_events.014.f: "Almost as if to make up for their loss of prestige after the Greek War of Independence, the Phanariotes seem set on assimilating the entirety of the Balkans into a singular Greek church."
 kog_schism_events.014.a: "Request that the Sultan right this travesty."
 kog_schism_events.014.b: "We shouldn't challenge the primacy of Constantinople."
 kog_schism_events.015.t: "Ecclesiastic Purges"
 kog_schism_events.015.d: "In defense of our [SCOPE.sCulture('kog_primary_culture_scope').GetName] identity, [GetCulture('greek').GetName] bishops have been subjected to incredible harassment by both clergy and layperson alike. Slowly but surely, bishop after bishop has returned to Ottoman lands to seek friendlier appointments. It may serve us well to better organize these efforts."
 kog_schism_events.015.f: "The [SCOPE.sCulture('kog_primary_culture_scope').GetName] churches have been firmly under the control of Constantinople. As a means of suppressing our identity, they have systematically blocked the appointment of native-[SCOPE.sCulture('kog_primary_culture_scope').GetName] bishops to our lands."
 kog_schism_events.015.a: "Our people will not fall to such underhanded tricks."
 kog_schism_events.015.b: "The Church must remain clean of politics."
 kog_schism_events.016.t: "Promoting Local Bishops"
 kog_schism_events.016.d: "As our church begins to assume direct control of ecclesiastic affairs, senior bishops have requested that priests receive abbreviated training and education to cover open positions in churches and administrative roles."
 kog_schism_events.016.f: "The transition to a self-controlled church has been extremely disruptive, and the church has found itself short of senior bishops. Some worry that the rush to fill open roles could compromise the integrity of the clergy."
 kog_schism_events.016.a: "We should fast track new recruits for ordination."
 kog_schism_events.016.b: "This process is a sacred one and deserves attention to detail."
 kog_schism_events.017.t: "Monastic Brawls"
 kog_schism_events.017.d: "While physical altercations over theological matter are not unheard of in the church, the latest street fight between priests in [SCOPE.sState('kog_monk_fight_state_scope').GetCityHubName] has grabbed headlines by it's sheer scale. From the young to the old, several priests have begun arriving at hospitals with injuries from the brawl."
 kog_schism_events.017.f: "What began as a dispute over the last three words in a sentence quickly overtook the church and spilled into the streets. Unfortunately, the two priests leading the dispute have both been momentarily incapacitated, stalling any progress until they can return to their positions."
 kog_schism_events.017.a: "This is clearly an issue for the monks to resolve."
 kog_schism_events.017.b: "We cannot tolerate such unmonkish behavior."
 kog_schism_events.018.t: "[SCOPE.sCharacter('kog_denouncing_agitator_scope').GetFullName] Condemns Schism"
 kog_schism_events.018.d: "[SCOPE.sCharacter('kog_denouncing_agitator_scope').GetFullName], a staunch advocate for the supremacy of the Church, has denounced the [ROOT.GetCountry.GetAdjectiveNoFlag] state in its intent to seize control of the Church from Constantinople. Supporters of [concept_autocephaly] have demanded that his future speaking events be cancelled."
 kog_schism_events.018.f: ""We cannot tolerate this expansion of phyletism lest the church fracture into hundreds of village churches!""
 kog_schism_events.018.a: "Let Him Speak"
 kog_schism_events.018.b: "Curtail His Appearances"
 kog_schism_events.019.t: "Prominent Priest Assassinated"
 kog_schism_events.019.d: "Several shots rang out in [ROOT.GetCountry.GetCapital.GetCityHubName] as a prominent member of the [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant] was assassinated for openly endorsing the schism from Constantinople. Politicians and bishops alike have demanded increased protections for the clergy."
 kog_schism_events.019.f: "The sudden slaying of a priest in broad daylight threatens to disrupt the smooth transition of administrative functions to local recruited priests"
 kog_schism_events.019.a: "Round up these renegades."
 kog_schism_events.019.b: "Shame the killers got away..."