 kog_orthodox_events.001.t: "The Bishops of the East"
 kog_orthodox_events.001.t.RUS: "The Most Holy Synod"
 kog_orthodox_events.001.t.GRE: "The Holy Synod of Greece"
 kog_orthodox_events.001.t.MON: "The Union of State and Church"
 kog_orthodox_events.001.t.SER: "Church of Saint Sava"
 kog_orthodox_events.001.t.BUL: "The Bulgarian Exarchate"
 kog_orthodox_events.001.t.ROM: "The Faith in the Principalities"
 kog_orthodox_events.001.t.ALK: "Orthodoxy in the New World"
 kog_orthodox_events.001.d: "As the world enters a new age, scholars and state leaders have begun to debate the role of the [ROOT.GetCountry.GetStateReligion.GetName] Church within the state. Some push for full state control of the Church, like the Byzantines and Russians, while others advocate a more hands-off approach, with fears that such influence might invite a new form of oppression like that of the Ottomans."
 kog_orthodox_events.001.d.RUS: "The Eastern Orthodox Church of [ROOT.GetCountry.GetName] has grown to become the largest and most influential of the Patriarchates of the Eastern Church. With a jurisdiction that now reaches from the banks of the Black Sea in Europe to the Yukon Mountains in North America, Russian Emperors have sought to dominate the Orthodox Church."
 kog_orthodox_events.001.a.GRE: "[ROOT.GetCountry.GetName] is an Orthodox nation, yet it is ruled by a Catholic King and beset with Protestant missionaries. The regency council has unilaterally declared the church in Greece to be autocephalous, considering the Ecumenical Patriarch in Constantinople to be little more than a pawn of the Sultan."
 kog_orthodox_events.001.f: "The Eastern Orthodox tradition has diverged heavily from the Roman Catholic tradition in the West. Having rejected the primacy of Rome in Church affairs, the Orthodox Church is led by five Patriarchs, four at the Ancient Seats of Constantinople, Antioch, Alexandria, and Jerusalem, with a fifth seated in Moscow. However, with the rise of Nationalism, states have sought increased control over ecclesiastical affairs."
 kog_orthodox_events.001.a: "God willing, we will prevail."
 kog_orthodox_events.001.a.RUS: "\"Oriental affairs are above all a matter for Russia.\""

 kog_orthodox_events.002.t: "Venerating an Icon"
 kog_orthodox_events.002.d: "#bold At the direction of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], bishops from the [SCOPE.gsInterestGroup('devout_scope').GetName] have presented several options for the dissemination to, and veneration of, state-sponsored icons at churches throughout [ROOT.GetCountry.GetName]. Each one promises to inspire the faithful.#!"
 kog_orthodox_events.002.f: "The tradition of Iconography in the Eastern Churches can be traced back to the early Christian church as it transitioned to becoming the state religion of the Roman Empire. Developed and maintained in relative isolation from the traditions in the West, the styles and motifs of icons is a hallmark of the Eastern Orthodoxy."
 kog_orthodox_events.002.st: "Select an Icon to Venerate:"
 kog_orthodox_events.002.a: "@kog_icon_none!"
