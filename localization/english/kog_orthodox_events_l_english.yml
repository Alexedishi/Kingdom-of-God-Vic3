 kog_orthodox.508.t: "Birth of the New Crusades"
 kog_orthodox.508.d: "Following weeks of theological and moral debate, the Partiarchs have stepped forward with a unified message: that the use of force to protect Christians abroad from persecution is not only right, but divinely mandated."
 kog_orthodox.508.f: "No longer will the Orthodox Church stand by as the faithful suffer the abuses of both the western heretics and eastern heathens."
 kog_orthodox.508.a: "Εν τούτω νίκα!"
 kog_orthodox.508.b: "Εν τούτω νίκα!"
 kog_orthodox.509.t: "The Byzantine Commonwealth"
 kog_orthodox.509.d: "In an arrogant and pompous ceremony in [SCOPE.sCountry('kog_conqueror_scope').GetCapital.GetName], [SCOPE.sCountry('kog_conqueror_scope').GetName] has declared the creation of the #bold #o Orthodox Commonwealth#!#!. With an aim to unify all [GetReligion('orthodox').GetName] peoples under one banner, this, no doubt, threatens the international order."
 kog_orthodox.509.f: ""According to the apostolic teaching and the doctrine of the Gospel, let us believe in the one Deity of the Father, Son and Holy Spirit, in equal majesty and in a holy Trinity. We authorize the followers of this law to assume the title Catholic Christians; but as for the others, since in our judgment they are foolish madmen, we decree that they shall be branded with the ignominious name of heretics, and shall not presume to give their conventicles the name of churches." -Theodosius I"
 kog_orthodox.509.a: "What does this mean?"
 
 kog_orthodox.600.t: "An Audience with the Patriarch"
 kog_orthodox.600.d: "[ROOT.GetCountry.GetRuler.GetFullName] has been graciously hosted by the Ecumenical Patriarch, [SCOPE.sCharacter('kog_patriarch_event_scope').GetFirstName]. After a pompous ceremony and a choreographed event featuring a dicussion of "common values and religious ties" between the countries of the [GetReligion('orthodox').GetName], [ROOT.GetCountry.GetRuler.GetLastName] has met with the Patriarch to seek his blessings for the nation."
 kog_orthodox.600.f: "Throughout the centuries of domination by the Ottomans, the Church has served as the common force holding the peoples of the Balkans together. By seeking "divine" approval, our leaders can instill confidence in our governance."
 kog_orthodox.600.1: "God, bless us with decisive leadership."
 kog_orthodox.600.2: "Lord, bless us with good governance."
 kog_orthodox.600.3: "Father, bless us with grace in diplomacy."
 kog_orthodox.600.4: "Maker, bless us with skill in the art of war."
 kog_orthodox.600.a: "Perhaps this isn't the best time..."
 kog_orthodox.601.t: "The Ecumenical Patriarch's Blessings"
 kog_orthodox.601.d: "In recognition of the piety of [ROOT.GetCountry.GetName]'s pious legal framework, the Ecumenical Patriarch, [SCOPE.sCharacter('kog_patriarch_event_scope').GetFirstName], has declared our country to be a manifestation of divine grace on Earth."
 kog_orthodox.601.f: "Our nation is guided by the Faith and safeguards all its citizens from both malady and misfortune. None can question our divine purpose."
 kog_orthodox.601.a: "May God have mercy on [ROOT.GetCountry.GetName]."
 kog_orthodox.602.t: "Ecumenical Patriarch Denounces Secularism"
 kog_orthodox.602.d: "In an inflammatory tomos, the Ecumenical Partiarch, [SCOPE.sCharacter('kog_patriarch_event_scope').GetFirstName], has denounced the spread of Secularism across [ROOT.GetCountry.GetName], declaring us to be "nihilist apostates." While his word is just that, the faithful in our country have found validation in his condemnation."
 kog_orthodox.602.f: "While framed as a theological rebuke, the Patriarch's missive reflects the very real concern amongst both the clergy and laypeople that our policies will lead to the extinction of the faith."
 kog_orthodox.602.a: "We must have reason!"
