 kog_orthodox.503.t: "Encyclical of the Eastern Patriarchs"
 kog_orthodox.503.d1: "In a message to the Eastern Churches, the Pope, [SCOPE.sCharacter('kog_rome_patriarch_scope').GetFullName], has urged the Orthodoxy to seek reunion with the West. Following fervent dicussions, the Ecumenical Council has elected to reject the Pope's epistle. In a lengthy response, rebutting several Western heresies, the Partiarchs have denounced the letter as fallacious."
 kog_orthodox.503.d2: "In a message to the Eastern Churches, the Pope, [SCOPE.sCharacter('kog_rome_patriarch_scope').GetFullName], has urged the Orthodoxy to seek reunion with the West. Following a storm of arguments resembling a tavern brawl more than a a theological debate, the Ecumenical Council has stunned the world by not only accepting but embracing the chance at closer ties between the East and West."
 kog_orthodox.503.f: ""Now, the God of peace, "that brought again from the dead that great Shepherd of the sheep," "He that keepeth Israel," who "shall neither slumber nor sleep," "keep your hearts and minds," "and direct your ways to every good work."\n\nPeace and joy be with you in the LORD."\n- Encyclical of the Eastern Patriarchs, 1848"
 kog_orthodox.503.a: "The Pope should learn humility."
 kog_orthodox.503.b: "We will extend an olive branch."
 kog_orthodox.504.t: "Problems with Phyletism"
 kog_orthodox.504.d1: "Following the guidance and seniority of the Ancient Patriarchates, the Ecumenical Council has condemned the issue of Phyletism, declaring that any type of ethno-centrism within the Church is an affront to the Ecumene."
 kog_orthodox.504.d2: "In a revolt against tradition and ecclesiastical structure, the Ecumenical Council has endorsed the establishment of overlapping episcopal sees with the goal of tailoring the divine word to national communities across the Orthodox world."
 kog_orthodox.504.f: ""Both you (Greeks) and the Bulgarians can equally be accused of phyletism, that is, of introducing ethnic interests into Church questions, and in the use of religion as a political weapon; but the difference lies in the fact that Bulgarian phyletism is defensive, while yours is offensive. Their phyletism seeks only to mark out the boundaries of their tribe; yours seeks to cross the boundaries of Hellenism" -K. Leontiev, 1872"
 kog_orthodox.504.a: "We are one united Church."
 kog_orthodox.504.b: "Every community deserves its Church."
 kog_orthodox.505.t1: "The Sacred Calendar"
 kog_orthodox.505.t2: "The Revised Julian Calendar"
 kog_orthodox.505.d1: "In a rebuke to the liberalizing pressure from the West, the Ecumenical Council has rejected any notion of making any changes to the Julian calendar, considering it tantamount to adopting the Gregorian calendar, itself a heretical symbol of the West."
 kog_orthodox.505.d2: "After weeks of passionate arguments by scholars from across the Orthodox world, the Ecumenical Council has agreed to implement a Revised form of the Julian Calendar. Boasting a precision competitive with that of the Gregorian calendar, the revision has successfully resolved equinox drift for millennia to come."
 kog_orthodox.505.f: ""The difference between the length of the political year of the new calendar and the Gregorian is so small that only after 877 years it is observed difference of dates. -M. Milanković, 1923"
 kog_orthodox.505.a: "This is the right choice."
 kog_orthodox.505.b: "We will not abandon our roots."
