 kog_orthodox.100.t: "Bible Translation Published"
 kog_orthodox.100.d: "The faithful in [SCOPE.sState('kog_event_state').GetName] are in an uproar over a plan by the [SCOPE.gsInterestGroup('intelligentsia_scope').GetName] to publish a translation of the Holy Book in Common [ROOT.GetCountry.GetAdjectiveNoFormatting]."
 kog_orthodox.100.f: ""Who amongst the peasants and the workers, who even among the merchants and the clerks and all those who have not completed secondary education can understand the language of the Gospels? No one." -Akropolis, published 9 September 1901"
 kog_orthodox.100.a: "Let the faithful read!"
 kog_orthodox.100.b: "This is an insult to the divine word!"
 kog_orthodox.101.t: "A Heretical Ruler"
 kog_orthodox.101.d: "[ROOT.GetCountry.GetName] is an [GetReligion('orthodox').GetName] nation, yet [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] follows the [ROOT.GetCountry.GetRuler.GetReligion.GetName] faith. Vocal church leaders have suggesting that it is high time the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] put the good of the nation before his personal matters and join the church."
 kog_orthodox.101.f: "The Eastern Orthodox Church has held sway over the Balkans and Asia Minor since the time of the Romans. However, in the intervening centuries, both Catholicism and Protestantism have risen in the West. This has clashed with local nations who have found themselves led by non-Orthodox sovereigns imposed upon them by the Great Powers."
 kog_orthodox.101.a: "The royal family will join the Church."
 kog_orthodox.101.b: "We will compromise with the heir, [SCOPE.sCharacter('kog_heir_scope').GetFirstName]."
 kog_orthodox.101.c: "This is nonsense!"
