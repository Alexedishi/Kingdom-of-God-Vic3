 kog_orthodox.200.t: "Theological Dispute with Patriarch"
 kog_orthodox.200.d: "Metropolitan [GetInterestGroupVariant('ig_devout',GetPlayer).GetLeader.GetFirstName] has become embroiled in a theological dispute with [SCOPE.sCharacter('kog_patriarch_event_scope').GetFirstName], the Patriarch of [SCOPE.GetRootScope.GetCountry.GetCustom('kog_seat_event_type')] leading to accusations of heresy on the part of the state church."
 kog_orthodox.200.f: "From the Septuagint to the Julian calendar, the Orthodoxy clings to the traditions that have allowed it to survive domination by the Ottoman state."
 kog_orthodox.200.a: "We should seek compromise."
 kog_orthodox.200.b: "He has no authority in [ROOT.GetCountry.GetName]."
