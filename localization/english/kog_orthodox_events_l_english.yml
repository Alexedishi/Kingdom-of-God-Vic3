 kog_orthodox.300.t: "Declaration of Schism with kog_constantinople$"
 kog_orthodox.300.d: "In a breach of the old order, the Church of [ROOT.GetCountry.GetName] has broken communion with the Ecumenical Partiarchate and declared their [concept_autocephaly]. As expected, the Ecumenical Partiarch, [SCOPE.sCharacter('kog_constantinople_patriarch_scope').GetFirstName], has condemned our actions and threatened us with excommunication."
 kog_orthodox.300.f: ""
 kog_orthodox.300.a: "[ROOT.GetCountry.GetName] will take charge of its faithful."

 kog_orthodox.310.t: "Traditionalists March in [ROOT.GetCountry.GetCapital.GetCityHubName]"
 kog_orthodox.310.d: "[GetReligion('orthodox').GetName] traditionalists have staged an enourmous march in [ROOT.GetCountry.GetCapital.GetCityHubName] demanding that the state put an end the heresey of schism with Constantinople, or at least grant them "safeguards" against "state-sponsored nihilism"."
 kog_orthodox.310.f: "Amongst their many grievances they count matters such as deviation from a universal doctrine and the destruction of church tradition; yet, many are quick to forget the abuses of the Phanariotes."
 kog_orthodox.310.a: "The only future for [ROOT.GetCountry.GetName] is one free of Constantinople."
 kog_orthodox.310.b: "We cannot ignore the voices of the faihful."
 kog_orthodox.311.t: "A Church for the Nation"
 kog_orthodox.311.d: "As the Church of [ROOT.GetCountry.GetName] continues to distenangle itself from the ecclesiarchy of Constantinople, both bishops and scholars have questioned what the role of the church will be within the [ROOT.GetCountry.GetAdjectiveNoFormatting] state with many arguing that it should serve the cause of #yellow Nationalism#!."
 kog_orthodox.311.f: "In transforming the Church into something that is singularly [ROOT.GetCountry.GetAdjectiveNoFormatting], the state has the unique opportunity to leverage its influence over the fabric of society."
 kog_orthodox.311.a: "The Church will champion our national identity."
 kog_orthodox.311.b: "The clergy are best removed from societal affairs."
 kog_orthodox.312.t: "[SCOPE.sReligion('kog_minority_religion_scope').GetName] Adherents Seek Equality"
 kog_orthodox.312.d: "The withdrawal of our Church from the wider [GetReligion('orthodox').GetName] community has prompted concern among members of the [SCOPE.sReligion('kog_minority_religion_scope').GetName] population regarding the errosion of protections they enjoyed under the old regime. Community leaders have petitioned the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to endorse laws protecting them from discrimination."
 kog_orthodox.312.f: ""
 kog_orthodox.312.a: "They tolerated us in their time. We should return the favor."
 kog_orthodox.312.b: "[ROOT.GetCountry.GetNameNoFlag] is an [GetReligion('orthodox').GetName] nation first."
 kog_orthodox.313.t: "Partiarch Denounces Schism"
 kog_orthodox.313.d: "[SCOPE.sCharacter('kog_patriarch_event_scope').GetFirstName], the Patriarch of [SCOPE.GetRootScope.GetCountry.GetCustom('kog_seat_event_type')] has condemned the heresey of unilateral schism with Constantinople."
 kog_orthodox.313.f: "The unilateral severance of communion with the Ecumenical Partiarchate has not gone without controversy, as the Turk and Russian dominated church elders seek to avoid any threats to their legitmacy."
 kog_orthodox.313.a: "What does [SCOPE.sCharacter('kog_patriarch_event_scope').GetFirstName] know of our people?"
 kog_orthodox.313.b: "Perhaps we could assuage his concerns."
 kog_orthodox.314.t: "Liturgical Language"
 kog_orthodox.314.d: "[GetCulture('greek').GetName] Phanariot bishops in [ROOT.GetCountry.GetCapital.GetCityHubName] have caused an uproar by imposing Greek as the primary language in both school and religions. The church is the only means by which our [GetCulture('kog_primary_culture_scope').GetName] language has survived Ottoman domination. Should they have their way, the very idea of a [GetCulture('kog_primary_culture_scope').GetName] state may be swept to the wind."
 kog_orthodox.314.f: "Almost as if to make up for their loss of prestige after the Greek War of Independence, the Phariotes seem set on assimilating the entirety of the Balkans into a singular Greek church."
 kog_orthodox.314.a: "Request that the Sultan right this travesty."
 kog_orthodox.314.b: "We shouldn't challenge the primacy of Constantinople."
 kog_orthodox.315.t: "Ecclesiatic Purges"
 kog_orthodox.315.d: "In defense of our [GetCulture('kog_primary_culture_scope').GetName] identity, [GetCulture('greek').GetName] bishops have been subjected to incredible harassment by both clergy and layperson alike. Slowly but surely, bishop after bishop has returned to Ottoman lands to seek friendlier appointments. It may serve us well to better organize these efforts."
 kog_orthodox.315.f: "The [GetCulture('kog_primary_culture_scope').GetName] churchs have been firmly under the control of Constantinople. As a means of suppressing our identity, they have systematically blocked the appointment of native-[GetCulture('kog_primary_culture_scope').GetName] bishops to our lands.
 kog_orthodox.315.a: "Our people will not fall to such underhanded tricks."
 kog_orthodox.315.b: "The Church must remain clean of politics."
 kog_orthodox.316.t: "Promoting Local Bishops"
 kog_orthodox.316.d: "As our church begins to assume direct control of ecclesiastic affairs, senior bishops have requested that priests receive abbreviated training and education to cover open positions in churches and administrative roles."
 kog_orthodox.316.f: "The transition to a self-controlled church has been extrememly disruptive, and the church has found itself short of senior bishops. Some worry that the rush to fill open roles could compromise the integrity of the clergy."
 kog_orthodox.316.a: "We should fast track new recruits for ordination."
 kog_orthodox.316.b: "This process is a sacred one and deserves attention to detail."
 kog_orthodox.317.t: "Monastic Brawls"
 kog_orthodox.317.d: "While physical altercations over theological matter are not unheard of in the church, the latest street fight between priests in [SCOPE.sState('kog_monk_fight_state_scope').GetCityHubName] has grabbed headlines by it's sheer scale. From the young to the old, several priests have begun arriving at hospitals with injuries from the brawl."
 kog_orthodox.317.f: "What began as a dispute over the last three words in a sentence quickly overtook the church and spilled into the streets. Unfortunately, the two priests leading the dispute have both been momentarily incapacitated, stalling any progress until they can return to their positions."
 kog_orthodox.317.a: "This is clearly an issue for the monks to resolve."
 kog_orthodox.317.b: "We cannot tolerate such unmonkish behavior."
 kog_orthodox.318.t: "[SCOPE.sCharacter('kog_denouncing_agitator_scope').GetFullName] Condemns Schism"
 kog_orthodox.318.d: "[SCOPE.sCharacter('kog_denouncing_agitator_scope').GetFullName], a staunch advocate for the supremacy of the Church, has denounced the [ROOT.GetCountry.GetAdjectiveNoFlag] state in its intent to seize control of the Church from Constantinople. Supporters of [concept_autocephaly] have demanded that his future speaking events be cancelled."
 kog_orthodox.318.f: ""We cannot tolerate this expansion of phyletism lest the church fracture into hundreds of village churches!""
 kog_orthodox.318.a: "Let Him Speak"
 kog_orthodox.318.b: "Curtail His Appearances"
 kog_orthodox.319.t: "Prominent Priest Assassinated"
 kog_orthodox.319.d: "Several shots rang out in [ROOT.GetCountry.GetCapital.GetCityHubName] as a prominent member of the [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant] was assassinated for openly endorsing the schism from Constantinople. Politicians and bishops alike have demanded increased protections for the clergy."
 kog_orthodox.319.f: "The sudden slaying of a priest in borad daylight threatens to disrupt the smooth transition of administrative functions to local recruited priests"
 kog_orthodox.319.a: "Round up these renegades."
 kog_orthodox.319.b: "Shame the killers got away..."

