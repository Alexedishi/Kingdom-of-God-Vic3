 kog_orthodox.090.t: "The Patriarchate Rises"
 kog_orthodox.090.d: "Church bells ring and people cheer as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] declares the birth of the #bold #o Orthodox Commonwealth#!#!. Beneath the imposing presence of the capitol at [ROOT.GetCountry.GetCapital.GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been adorned with reconstructions of the old sigils and regalia of the Partiarchs of Constantinople. Stepping forward towards the array of citizens, dignitaries, and clergy, [ROOT.GetCountry.GetRuler.GetFirstName] stands as a beacon for the future of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people."
 kog_orthodox.090.f: ""Wherever the bishop shall appear, there let the multitude of the people also be; even as, wherever Jesus Christ is, there is the Catholic Church." -Ignatius of Antioch, ca. 107 AD "
 kog_orthodox.090.a: "Our Church is Universal."
 kog_orthodox.091.t: "The Metropolitan Lands"
 kog_orthodox.091.d: "Our efforts have borne fruit with the rebirth of the [ROOT.GetCountry.GetName]. Now several voices call for the restoration of [ROOT.GetCountry.GetAdjectiveNoFormatting] power and prestige with the return of formerly Byzantine lands to [ROOT.GetCountry.GetAdjectiveNoFormatting] hands. It falls to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to enact the future of the [GetReligion('orthodox').GetName] state."
 kog_orthodox.091.f: ""For the Fathers rightly granted privileges to the throne of old Rome, because it was the royal city. And the One Hundred and Fifty most religious Bishops, actuated by the same consideration, gave equal privileges to the most holy throne of New Rome, justly judging that the city which is honoured with the Sovereignty and the Senate and enjoys equal privileges with the old imperial Rome, should in ecclesiastical matters also be magnified as she is, and rank next after her." -Canon XXVIII, Council of Chalcedon, 451"
 kog_orthodox.091.a: "All faithful shall be sheltered by the Patriarchs."
 kog_orthodox.092.t: "The Orthodox Realms"
 kog_orthodox.092.d: "Our conquests have finally rescued Eastern Christendom after over a millennium of oppression. Now, the Patriarchs work diligently to restore the churches shuttered during Muslim rule. After debates and deliberations, the Patriarch of Constantinople along with the other Patriarchs of the East have declared the birth of a unified [GetReligion('orthodox').GetName] Domain."
 kog_orthodox.092.f: ""So know, pious king, that all the Christian kingdoms came to an end and came together in a single kingdom of yours, two Romes have fallen, the third stands, and there will be no fourth. No one shall replace your Christian Tsardom according to the great Theologian.""
 kog_orthodox.092.a: "The Eastern Church is whole, let us count our blessings."
 kog_orthodox.093.t: "The Capture of the Great Mosque"
 kog_orthodox.093.d: "Our righteous crusades against the Saracens have brought their jewel, the heathen city of Mecca, into our grasp."
 kog_orthodox.093.f: "One by one, rank after rank of Byzantine soldiers advanced into the city. There we beheld the Great Mosque, and at its heart the pagan relic, the al-Ḥajaru al-Aswad... the #black Black Stone#!."
 kog_orthodox.093.a: "We bring no peace. Burn it all down."
 kog_orthodox.093.b: "We will turn it into a museum."
 kog_orthodox.093.c: "The Saracens kept peace in Jerusalem. We will keep peace in Mecca."
 kog_orthodox.094.t: "The Ancient Patriarchates"
 kog_orthodox.094.d: "After centuries of separation, the great seats of Eastern Christendom have been returned to the rule of the Emperor in Constantinople."
 kog_orthodox.094.f: "With the heartlands of Eastern Christianity within our control, religious and social leaders call for the reunification of the Imperial Office with that of the Orthodoxy."
 kog_orthodox.094.a: "Mother Mary smiles upon us."
 kog_orthodox.095.t: "The Restoration of the Pentarchy"
 kog_orthodox.095.d: "By the Grace of God and through the valiant efforts of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state, we have brought all five of the original seats of Christianity under the umbrella of the Orthodoxy. In an auspicious ceremony in the heart of the Vatican, the Patriarchs of the Church have declared [ROOT.GetCountry.GetName] to be the sole defender of and authority over the Church of the East."
 kog_orthodox.095.f: "As it was in Roman times, the church is once again unified under the control of a singular state that both supports and oversees its ecclesiastic functions."
 kog_orthodox.095.a: "Glory to [ROOT.GetCountry.GetName]"
