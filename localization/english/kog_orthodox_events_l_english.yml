 kog_orthodox.220.t: "Venerating an Icon"
 kog_orthodox.220.d: "#bold At the direction of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], bishops from the [SCOPE.gsInterestGroup('devout_scope').GetName] have presented several options for the dissemination to, and veneration of, state-sponsored icons at churches throughout [ROOT.GetCountry.GetName]. Each one promises to inspire the faithful.#!"
 kog_orthodox.220.f: "The tradition of Iconography in the Eastern Churches can be traced back to the early Christian church as it transitioned to becoming the state religion of the Roman Empire. Developed and maintained in relative isolation from the traditions in the West, the styles and motifs of icons is a hallmark of the Eastern Orthodoxy."
 kog_orthodox.220.st: "Select an Icon to Venerate:"
 kog_orthodox.220.1: "@kog_icon_none!"
 kog_orthodox.220.1.tt: "#bold We need not venerate an icon.#!\n$TOOLTIP_DELIMITER$"
 kog_orthodox.220.2: "@kog_icon_pantocrator!"
 kog_orthodox.220.2.tt: "#bold The Savior will provide for us.#!\n$TOOLTIP_DELIMITER$"
 kog_orthodox.220.3: "@kog_icon_eleusa!"
 kog_orthodox.220.3.tt: "#bold Mother Mary will nurture us.#!\n$TOOLTIP_DELIMITER$"
 kog_orthodox.220.4: "@kog_icon_climacus!"
 kog_orthodox.220.4.tt: "#bold St. John Climacus will inspire us."#!\n$TOOLTIP_DELIMITER$"
 kog_orthodox.220.5: "@kog_icon_archangel!"
 kog_orthodox.220.5.tt: "#bold Michael, the Archangel, will protect us.#!\n$TOOLTIP_DELIMITER$"
 kog_orthodox.220.6: "@kog_icon_wonderworker!"
 kog_orthodox.220.6.tt: "#bold St. Nicholas, the Wonderworker, will aid us.#!\n$TOOLTIP_DELIMITER$"
 kog_orthodox.220.7: "@kog_icon_theologian!"
 kog_orthodox.220.7.tt: "#bold St. Gregory, the Theologian, will enlighten us.#!\n$TOOLTIP_DELIMITER$"
 kog_orthodox.220.8: "@kog_icon_anchorite!"
 kog_orthodox.220.8.tt: "#bold St. Paul, the First Hermit, will temper us.#!\n$TOOLTIP_DELIMITER$"
 kog_orthodox.220.9: "@kog_icon_syrian!"
 kog_orthodox.220.9.tt: "#bold St. Issac, the Syrian, will humble us.#!\n$TOOLTIP_DELIMITER$"
