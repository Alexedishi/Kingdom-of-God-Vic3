 ## Episcopal Seat Buttons
 kog_gui_sway_seat: "@kog_improve_relations! #bold Improve Relations#!"
 kog_gui_sway_seat_desc: "Within the fabric of Christendom, the Patriarchates often find themselves at odds with each other. By ingratiating ourselves to them, we may be able to count on their support in the spiritual affairs of the state."
 kog_gui_sway_seat_effect: "[GetPlayer.GetNameNoFlag] will begin #bold improving#! $kog_relations$ with [Container.GetName.GetFlagName]"
 kog_gui_antagonize_seat: "@kog_damage_relations! #bold Damage Relations#!"
 kog_gui_antagonize_seat_desc: "Within the fabric of Christendom, the Patriarchates often find themselves at odds with each other. By ensuring hostilities between ourselves and certain seats, we can earn the respect of those of our faith community."
 kog_gui_antagonize_seat_effect: "[GetPlayer.GetNameNoFlag] will begin #bold harming#! $kog_relations$ with [Container.GetName.GetFlagName]"
 kog_gui_integrate_seat: "@kog_integrate_seat! #bold Integrate Seat#!"
 kog_gui_integrate_seat_desc: "Should the location of this seat come under our control, we could replace its leadership with bishops loyal to our cause. This may anger their former patrons and well as the Catholic world at large."
 kog_gui_integrate_seat_effect: "[GetPlayer.GetNameNoFlag] will begin the process of seizing ecclesial control over [Container.GetName.GetFlagName]"
 kog_gui_enforce_seat: "@kog_enforce_rite! #bold Enforce Rites#!"
 kog_gui_enforce_seat_desc: "In the centuries since the collapse of the Roman Empire, the many churches have deviated from each other in their chosen [concept_liturgical_rite]. Should the location of this seat come under our control, we could enforce their compliance with our [concept_liturgical_rite]."
 kog_gui_enforce_seat_effect: "[GetPlayer.GetNameNoFlag] will begin the process of enforcing our $kog_liturgical_rite$ upon [Container.GetName.GetFlagName]"
 kog_gui_assert_seat: "@kog_integrate_seat! #bold Assert Seat Control#!"
 kog_gui_assert_seat_desc: ""
 kog_gui_install_seat: "@kog_install_bishop! #bold Install Bishop#!"
 kog_gui_install_seat_desc: "Despite the church nominally serving only to spread the word of faith, politics penetrates deep into the administration of the church. Should a state have sufficient leverage over a seat, they could strong arm the installment of a friendlier bishop."
 
 kog_enforce_seat_sgui_trigger: "[GetPlayer.GetNameNoFlag] $kog_controls$ this $concept_episcopal_seat$"
 kog_enforce_seat_sgui_effect: "[GetPlayer.GetNameNoFlag] will begin the process of enforcing our $kog_liturgical_rite$ upon this $concept_episcopal_seat$"
 
 kog_assert_seat_sgui_trigger: "[GetPlayer.GetNameNoFlag] $kog_controls$ the $kog_home_province of this$ $concept_episcopal_seat$"
 kog_assert_seat_sgui_effect: "[GetPlayer.GetNameNoFlag] will seize $kog_control$ over this $concept_episcopal_seat$"
 
