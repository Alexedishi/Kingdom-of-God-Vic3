 # Objectives
 objective_kog: "@kog!Kingdom of God"
 objective_kog_desc: ""#italic We believe in one God, the Father almighty, maker of all things visible and invisible; And in one Lord, Jesus Christ, the Son of God, begotten from the Father, only-begotten...#!\n\nLead the Christian community into the dawning age of steam and steel. Hold fast to the traditions of old or charge bravely into this new world."
 
 objective_kog_name_PAP: "#v Papal States#!"
 objective_kog_desc_PAP: "#lore The Papal States are the collection of lands under the rule of Bishop of Rome, the Pope of the Catholic Church. Fresh off a popular revolt, the Papal administration struggles to fend off anti-clerical and nationalist movements.#!"
 objective_kog_name_FRA: "#v $FRA$#!"
 objective_kog_desc_FRA: "#lore Following decades of turmoil, the Concordat of 1801 restored order between the church and the state. However, tensions have arisen anew as the vocational missions of the church begin begin to assert themselves against the absolutist powers of the Bourbon monarchs.#!"
 objective_kog_name_RUS: "#v $RUS$#!"
 objective_kog_desc_RUS: "#lore Since the reforms of Peter the Great, the Most Holy Synod has ensured state control over the Russian Orthodoxy. Under the tutelage of the czars, the church serves as little more than an extension of imperial authority.#!"
 objective_kog_name_GRE: "#v $GRE$#!"
 objective_kog_desc_GRE: "#lore Greece has recently gained its independence from the Ottoman Empire. In a bid to insulate the young nation from Turkish meddling, the young King Otto has unilaterally severed communion with the Ecumenical Patriarchate.#!"
 objective_kog_name_ALK: "#v $ALK$#!"
 objective_kog_desc_ALK: "#lore Following in the footsteps of the Priest Ivan Veniaminov, Russian missionaries have spread across the Alaskan coasts seeking to educate and baptize all they can find.#!"
 objective_kog_name_SHW: "#v $SHW$#!"
 objective_kog_desc_SHW: "#lore In isolation from the Christian world, the Church in Ethiopia has fragmented along with the Ethiopian Empire. In Shewa, the King Sehla Selassie has asserted state control over the priesthood in his lands in defiance of the nominal authority of the Emperor.#!"
 objective_kog_name_PRU: "#v $PRU$#!"
 objective_kog_name_PRU_desc: "#lore #!"
 
