l_english:
 # Notifications
 notification_kog_autocephaly_declared_name: "Autocephaly Declared"
 notification_kog_autocephaly_declared_desc: "[SCOPE.sCountry('kog_schism_scope').GetName] has declared their [concept_autocephaly] in defiance of the Ecumenical Patriarch."
 notification_kog_autocephaly_declared_tooltip: "#header $notification_kog_autocephaly_declared_name$#!$kog_linebreak$$notification_kog_autocephaly_declared_desc$"
 notification_kog_autocephaly_recognized_name: "Autocephaly Recognized"
 notification_kog_autocephaly_recognized_desc: "[SCOPE.sCountry('kog_schism_scope').GetName] has been recognized by the Ecumenical Patriarch as an $kog_autocephalous$ jurisdiction of the Eastern Church."
 notification_kog_autocephaly_recognized_tooltip: "$notification_kog_autocephaly_recognized_name$$kog_linebreak$$notification_kog_autocephaly_recognized_desc$"
 
 ####---------- Episcopal Seat Notifications ----------####
 notification_kog_new_seat_integrated_same_religion_name: "[SCOPE.sCountry('kog_seat_integrator_scope').MakeScope.Var('kog_episcopal_seat_scope').GetName.GetFlagName] Usurped by [SCOPE.sCountry('kog_seat_integrator_scope').GetName]"
 notification_kog_new_seat_integrated_same_religion_desc: "[SCOPE.sCountry('kog_seat_integrator_scope').GetName] has seized control of the Holy Seat of [SCOPE.sCountry('kog_seat_integrator_scope').MakeScope.Var('kog_episcopal_seat_scope').GetName.GetFlagName] and installed bishops in alignment with them."
 notification_kog_new_seat_integrated_same_religion_tooltip: "#header $kog_new_seat_integrated_same_religion_name$#!$kog_linebreak$$kog_new_seat_integrated_same_religion_desc$"
 
 notification_kog_new_seat_integrated_different_religion_name: "$notification_kog_new_seat_integrated_same_religion_name$"
 notification_kog_new_seat_integrated_different_religion_desc: "$notification_kog_new_seat_integrated_same_religion_desc$"
 notification_kog_new_seat_integrated_different_religion_tooltip: "$notification_kog_new_seat_integrated_same_religion_tooltip$"