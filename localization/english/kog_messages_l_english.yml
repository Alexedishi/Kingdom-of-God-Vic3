 notification_kog_rome_replaced_name: "New Patriarch in $kog_rome$"
 notification_kog_rome_replaced_desc: "A new Bishop has taken up residence on the throne of St. Peter. This has reduced our relations with Rome by #red #bold -25#!#!."
 notification_kog_santiago_replaced_name: "New Patriarch in $kog_santiago$"
 notification_kog_santiago_replaced_desc: "A new Bishop has been appointed to Santiago de Compostela. This has reduced our relations with Santiago by #red #bold -25#!#!."
 notification_kog_paris_replaced_name: "New Patriarch in $kog_paris$"
 notification_kog_paris_replaced_desc: "A new Bishop has been appointed to the Archdiocese at Notre-Dame This has reduced our relations with Paris by #red #bold -25#!#!."
 notification_kog_koln_replaced_name: "New Patriarch in $kog_koln$"
 notification_kog_koln_replaced_desc: "A new Bishop has risen to the storied seat of Cologne. This has reduced our relations with Cologne by #red #bold -25#!#!."
 notification_kog_vienna_replaced_name: "New Patriarch in $kog_vienna$"
 notification_kog_vienna_replaced_desc: "A new Bishop has been appointed to administrate the Archdiocese of Vienna. This has reduced our relations with Vienna by #red #bold -25#!#!."
 notification_kog_constantinople_replaced_name: "New Patriarch in $kog_constantinople$"
 notification_kog_constantinople_replaced_desc: "A new Patriarch has been name as the Ecumenical Patriarch in Constantinople. This has reduced our relations with Constantinople by #red #bold -25#!#!."
 notification_kog_antioch_replaced_name: "New Patriarch in $kog_antioch$"
 notification_kog_antioch_replaced_desc: "A new bishop has been named Patriarch of Antioch and All The East. This has reduced our relations with Antioch by #red #bold -25#!#!."
 notification_kog_jerusalem_replaced_name: "New Patriarch in $kog_jerusalem$"
 notification_kog_jerusalem_replaced_desc: "A new bishop has assumed stewardship over the Patriarchate of Jerusalem. This has reduced our relations with Jerusalem by #red #bold -25#!#!."
 notification_kog_alexandria_replaced_name: "New Patriarch in $kog_alexandria$"
 notification_kog_alexandria_replaced_desc: "A new bishop has taken up residence as the Patriarch of Alexandria and All Africa. This has reduced our relations with Alexandria by #red #bold -25#!#!."
 notification_kog_moscow_replaced_name: "New Patriarch in $kog_moscow$"
 notification_kog_moscow_replaced_desc: "A new bishop has taken up leadership of the Most Holy Synod in Moscow. This has reduced our relations with Moscow by #red #bold -25#!#!."
 notification_kog_coptic_alexandria_replaced_name: "New Patriarch in $kog_coptic_alexandria$"
 notification_kog_coptic_alexandria_replaced_desc: "A new Patriarch has been elected to lead the Coptic Church. This has reduced our relations with Coptic Alexandria by #red #bold -25#!#!."
 notification_kog_syriac_antioch_replaced_name: "New Patriarch in $kog_syriac_antioch$"
 notification_kog_syriac_antioch_replaced_desc: "A new Patriarch has been elected to lead the Syriac Orthodox Church. This has reduced our relations with Syriac Antioch by #red #bold -25#!#!."
 notification_kog_etchmiadzin_replaced_name: "New Patriarch in $kog_etchmiadzin$"
 notification_kog_etchmiadzin_replaced_desc: "A new Patriarch has been elected to Mother See of Holy Etchmiadzin. This has reduced our relations with Etchmiadzin by #red #bold -25#!#!."
 notification_kog_addis_ababa_replaced_name: "New Patriarch in $kog_addis_ababa$"
 notification_kog_addis_ababa_replaced_desc: "A new Patriarch has been elected to the seat at Addis Ababa. This has reduced our relations with Addis Ababa by #red #bold -25#!#!."
 notification_kog_konak_replaced_name: "New Patriarch in $kog_konak$"
 notification_kog_konak_replaced_desc: "A new Patriarch has been elected to oversee the Ancient Church of the East. This has reduced our relations with Qudshanis by #red #bold -25#!#!."
 notification_kog_elysium_replaced_name: "New Patriarch in $kog_elysium$"
 notification_kog_elysium_replaced_desc: "A new bishop has been anointed to lead Elysium. This has reduced our relations with Elysium by #red #bold -25#!#!."
 notification_kog_tututepec_replaced_name: "New Patriarch in $kog_tututepec$"
 notification_kog_tututepec_replaced_desc: "A new bishop has ascended to the throne at the Hill of Birds. This has reduced our relations with Yucu Dzaa by #red #bold -25#!#!."
 notification_kog_cahokia_replaced_name: "New Patriarch in $kog_cahokia$"
 notification_kog_cahokia_replaced_desc: "A new Patriarch has been ordinated at the sacred mound at Cahokia. This has reduced our relations with Cahokia by #red #bold -25#!#!."
 
 notification_kog_divine_mandate_lost_name: "Divine Mandate Lost"
 notification_kog_divine_mandate_lost_desc: "Our recent legal reforms have stir controversy amongst the clergy. As a result, the Ecumenical Patriarch has rescinded his blessing of our administration, causing us to lose the [concept_timed_modifier] #bold Divine Mandate#!."
 notification_kog_secularism_denounced_removed_name: "Denunciation of Secularism Withdrawn"
 notification_kog_secularism_denounced_removed_desc: "Improvements in our standings with the Patriarch have resulted in the condemnation of our state being voided."
 notification_kog_deposition_declined_name: "Patriarchal Deposition Declined"
 notification_kog_deposition_declined_desc: "The #bold Sultan#! has declined our request to depose the Ecumenical Patriarch."
 notification_kog_lex_animata_lost_name: "Blessing of the Lex Animata Withdrawn"
 notification_kog_lex_animata_lost_desc: "Given our recent legal reforms, the clergy have agreed that the state can no longer claim to be the holy purveyors of theological wisdom. As a result, we have lost the [concept_timed_modifier] #bold Nómos Émpsychos#!."