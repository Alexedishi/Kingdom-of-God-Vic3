 ## Canon Laws
 concept_canon_law: "Canon Law"
 concept_canon_law_desc: "#bold Canon Law#! is a set of ordinances and regulations made by church leadership for the administration of a Christian organization or church and its members. These can take many forms ranging the central #italic Ius Canonicum#! of the [GetReligion('catholic').GetName] church to the localized ordinances of Congregationalist [GetReligion('protestant').GetName] churches."
 
 kog_canon_law_none: "#bold None#!"
 
 kog_canon_lawgroup_apostolic_succession: "Apostolic Succession"
 kog_canon_lawgroup_apostolic_succession_desc: "#bold Apostolic Succession#! is the belief by which a church traces the transmission of grace and ministerial authority from the disciples of Christ to the modern day. More conservative denominations assert that the consecration of Bishops by other Bishops is the only way to maintain the validity of priestly orders, while many [GetReligion('protestant').GetName] denominations assert this continuity is unnecessary and rooting in fundamental misunderstandings of scripture."
 kog_canon_law_papal_primacy: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_papal_primacy_desc')] Papal Primacy#!#!#!"
 kog_canon_law_papal_primacy_desc: "A single Bishop is elevated above the all others and wields sovereign and absolute authority over all other Bishops. In such a system, deviation from the mother church is tantamount to [concept_schism]."
 kog_canon_law_synodality: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_synodality_desc')] Synodality#!#!#!"
 kog_canon_law_synodality_desc: "Churches are lead by group of elected bishops who cooperate in administering the church. While specific Bishops may be recognized as more senior or prestigious, no church hold authority over any other."
 kog_canon_law_congregationalism: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_congregationalism_desc')] Congregationalism#!#!#!"
 kog_canon_law_congregationalism_desc: "Every local church, or congregation, operates with full independence as has full rights to interpret and preach scripture. In such a system, any center authority is hypothetical at best and fundamental theological disagreements are commonplace."
 
