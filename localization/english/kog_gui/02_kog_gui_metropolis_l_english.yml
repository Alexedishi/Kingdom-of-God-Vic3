 # Metropolitan Decision Buttons
 com_gui_metropolitan_buttons: "Metropolitan Decisions"
 
 # Catholic Scripted Buttons
 kog_gui_venerate_apparition: "Venerate Apparition"
 kog_gui_venerate_apparation_desc: "We can use our contacts within the Church to encourage the popular devotion of an approved Marian Apparition. This devotion will last ten years before requiring reinforcement."
 
 # Orthodox Scripted Buttons
 kog_gui_commission_icon: "Venerate an Icon"
 kog_gui_commission_icon_desc: "We can use some of our influence over the Church to commission icons to inspire the faithful. These icons will endure for 29_kog_episcopal_seat_effects.txt years before needing replacement."
 
 kog_gui_emphasize_unity: "Emphasize Unity"
 kog_gui_emphasize_unity_desc: "The Orthodoxy has tied our people together since the Fall of Constantinople. Our bishops could emphasize this common bond that supersedes nationalist thought."
 kog_gui_enforce_attendance: "Enforce Church Attendance"
 kog_gui_enforce_attendance_desc: "Many in our communities attend masses only for the holiest of days. We could empower social activists to "persuade" these people to participate more regularly in church services."
 kog_gui_theologize_dogma: "Theologize Novel Dogma"
 kog_gui_theologize_dogma_desc: "The theology of the Orthodoxy has remained stagnant since the Ottoman conquest. In its isolation from the West, the philosophy and dogma of the Church lags far behind the innovations of Europe, leaving it unsuited to guide the faithful into this new era."
 kog_gui_promote_ecumenism: "Promote Ecumenism"
 kog_gui_promote_ecumenism_desc: "As the early fathers said, we are one flock divided only by our disagreements over interpretations. We could pressure the church to reach out to its Western counterpart to seek some type of common understanding."
 kog_gui_metropolitan_focus_header: "Current Focus:"
 kog_gui_kog_focus_status: "[GetPlayer.MakeScope.GetCountry.GetCustom('kog_metropolitan_focus_type')]"
 
 kog_gui_dissolve_monasteries: "Dissolve the Monasteries"
 kog_gui_dissolve_monasteries_desc: "Throughout our hinterland, there are several ancient monasteries that cling on by momentum alone. Administrators have advised that the functions of both the church and the state could be dramatically improved by shuttering several minor monasteries."
 kog_gui_restore_monasteries: "Restore the Monasteries"
 kog_gui_restore_monasteries_desc: "As a result of the seizure of monastic estates, many clergy have found themselves destitute. Many would welcome some form of relief."
 kog_gui_reform_synod: "Reform National Synod"
 kog_gui_reform_synod_desc: "Caesaropapism, the idea of merging the church and state, has gained traction as a means of both protecting and enforcing our independent identity as a people. By subjugating the church to the state apparatus, we can insulate ourselves from further interference by the Sultan."
 kog_gui_restore_synod: "Restore National Synod"
 kog_gui_restore_synod_desc: "The act of subjugating the Church has had profound effects. Chafing under the yoke of the state, the Church has lost a lot of its former influence. If we wish, we could restore the independence of the clergy."
 kog_gui_grant_subsidies: "Grant Church Subsidies"
 kog_gui_grant_subsidies_desc: "The state could grant state subsidies to the Orthodox Church in the name of supporting the needs of the clergy... in exchange for their compliance."
 kog_gui_end_subsidies: "End Church Subsidies"
 kog_gui_end_subsidies_desc: "Civic leaders decry the use of secular funds to provide for spiritual matters. While they make sound legal arguements, the church risks collapse without our continued intervention."
 kog_gui_establish_schools: "Establish Sunday Schools"
 kog_gui_establish_schools_desc: "The best way to spread the divine word and to bring literacy to the poorest of our children is by providing them with weekly education following liturgical services."
 kog_gui_disband_schools: "Disband Sunday Schools"
 kog_gui_disband_schools_desc: "While weekend school programs have proven successful in guiding our youth to the faith, they have also proven a major expense for the state."