 ####---------- Episcopal Seat Scripted Buttons ----------####
 kog_gui_sway_seat: "@kog_improve_relations! #bold Improve Relations#!"
 kog_gui_sway_seat_desc: "Within the fabric of Christendom, the Patriarchates often find themselves at odds with each other. By ingratiating ourselves to them, we may be able to count on their support in the spiritual affairs of the state."
 kog_gui_antagonize_seat: "@kog_damage_relations! #bold Damage Relations#!"
 kog_gui_antagonize_seat_desc: "Within the fabric of Christendom, the Patriarchates often find themselves at odds with each other. By ensuring hostilities between ourselves and certain seats, we can earn the respect of those of our faith community."
 kog_gui_integrate_seat: "@kog_integrate_seat! #bold Integrate Seat#!"
 kog_gui_integrate_seat_desc: "Should the location of this seat come under our control, we could replace its leadership with bishops loyal to our cause. This may anger their former patrons and well as the Catholic world at large."
 kog_gui_enforce_seat: "@kog_integrate_seat! #bold Enforce Rites#!"
 kog_gui_enforce_seat_desc: "In the centuries since the collapse of the Roman Empire, the many churches have deviated from each other in their chosen [concept_liturgical_rite]. Should the location of this seat come under our control, we could enforce their compliance with our [concept_liturgical_rite]."
 kog_gui_install_seat: "Install Bishop"
 kog_gui_install_seat_desc: ""
 
