 ## Roman Catholic Church
 kog_rome: "kog_rome"
 kog_rome_name: "@kog_seat! #yellow #tooltip:[GetPlayer.GetTooltipTag],kog_rome_details Rome#!#!"
 kog_rome_header: "Patriarchate of Rome"
