 kog_rome_opinion: "#bold Opinion: #tooltippable;tooltip:[GetPlayer.GetTooltipTag],kog_rome_opinion_breakdown [GetPlayer.MakeScope.ScriptValue('kog_rome_opinion_value')|+=]#"
 kog_rome_opinion_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('kog_rome_opinion_value')]"
 kog_rome_modifier: "#bold Holding and $kog_controlling$ $kog_rome_name$ will grant the following modifier:#!\n [GetStaticModifier('modifier_kog_controls_rome').GetDesc]"
 # Informational Tooltips
 kog_rome_details: "@kog_seat! #header$kog_rome_building$#!$kog_linebreak$•#italic$kog_rome_location$#!\n•#white$kog_rome_patriarch$#!\n•#bold$kog_rome_controller$#!\n•#bold$kog_rome_opinion$#!"
