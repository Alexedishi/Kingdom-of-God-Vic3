# Global Community Panel
 kog_gui_christian_community: "Greater Christian Community"
 kog_gui_catholic_tab: "Roman Catholicism"
 kog_gui_catholic_tab_selected: "#bold #white Roman Catholicism#!#!"
 eocgm_gui_orthodox_tab: "Eastern Orthodoxy"
 eocgm_gui_orthodox_tab_selected: "#bold #white Eastern Orthodoxy#!#!"
 kog_gui_oriental_tab: "Oriental Orthodoxy"
 kog_gui_oriental_tab_selected: "#bold #white Oriental Orthodoxy#!#!"
 kog_gui_elysian_tab: "Elysian Orthodoxy"
 kog_gui_elysian_tab_selected: "#bold #white Elysian Orthodoxy#!#!"
 
 # General Seat Widget Loc
 kog_gui_secure_tetrarchy: "@kog_secure_seats! Secure the Tetrarchy"
 kog_gui_secure_tetrarchy_desc: "Under the auspices of the Byzantine state, the Ancient Patriarchates existed in a unified structure to administer the ecclesiarchy and shepherd the faithful. Should we secure control over these holy nexuses of the faith, we will be able to reunify the old heart of the Eastern Orthodoxy.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_secure_pentarchy: "@kog_secure_seats! Secure the Pentarchy"
 kog_gui_secure_pentarchy_desc: "The Pentarchy, consisting of the Eastern seats plus Rome, once ruled over the united Christian church before the Germanic invaders tore Rome away from the Empire for their political aspirations. If we can secure control over the Eternal City, we will be able to unify the Eastern and Western Patriarchates after almost a millennium of estrangement.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_mend_schism: "@kog_establish_communion! Mend the Great Schism"
 kog_gui_mend_schism_desc: "The five Ancient Seats of the Orthodoxy lie within our control, yet the two churches are divided by a millennium of deviations in legal frameworks and dogmatic principles. To truly combine the two Churches into one Great Church will be a herculean task, one that already failed many times over the centuries.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_mending_header: "#bold #khoine Mending Progress#!#!"
 kog_gui_mending_progress: "TODO"
 
 kog_gui_declare_autocephaly: "@kog_break_communion! Declare Autocephaly"
 kog_gui_declare_autocephaly_desc: "Once the symbol of unity in the Eastern Church, the Ecumenical Patriarch in Constantinople has increasingly come under the influence of the Ottoman Sultan. Unless we sever our connections with Constantinople, the Ottomans are sure to continue to interfere in our politics and may even try to further their attempts to suppress our culture.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_autocephaly_header: "#bold #khoine Autocephaly Progress#!#!"
 kog_gui_autocephaly_progress: "TODO"
 kog_gui_convoke_council: "@kog_seek_mandate! Convoke Ecumenical Council"
 kog_gui_convoke_council_desc: "Our influence within the [GetPlayer.GetStateReligion.GetName] community is obvious. We could use this power to summon an [concept_ecumenical_council] to settle long-standing issues within the [GetPlayer.GetStateReligion.GetName] Church.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 
 kog_assert_seat: "@kog_secure_seats! Assert State Supremacy"
 kog_gui_assert_rome_button: "Through the righteous efforts of [GetPlayer.GetNameNoFlag], $kog_rome$ has come under [GetPlayer.GetStateReligion.GetName] control. We should secure our new role as the defender of the faith by asserting state supremacy over the Throne of St. Peter.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_assert_constantinople_button: "Through the righteous efforts of [GetPlayer.GetNameNoFlag], $kog_constantinople$ has come under [GetPlayer.GetStateReligion.GetName] control. We should secure our new role as the defender of the faith by asserting state supremacy over the Ecumenical Patriarchate.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_assert_coptic_alexandria_button: "Through the righteous efforts of [GetPlayer.GetNameNoFlag], $kog_coptic_alexandria$ has come under [GetPlayer.GetStateReligion.GetName] control. We should secure our new role as the defender of the faith by asserting state supremacy over the Church of St. Mark.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_assert_elysium_button: "Through the righteous efforts of [GetPlayer.GetNameNoFlag], $kog_elysium$ has come under [GetPlayer.GetStateReligion.GetName] control. We should secure our new role as the defender of the faith by asserting state supremacy over the Patriarchal See.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 
 kog_seek_mandate: "@kog_seek_mandate! Seek Political Mandate"
 kog_gui_seek_mandate_desc: "The Orthodox people hold the positions of their Bishops in high regard. With a little manuvering, we could obtain the blessings of the Ecumenical Patriarch designating our administration as not only legitimate, but divine.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 
 kog_gui_integrate_seat: "@kog_integrate_seat! #bold Integrate Seat#!"
 kog_gui_integrate_seat_desc: "Should the location of this seat come under our control, we could replace its leadership with bishops loyal to our cause. This may anger their former patrons and well as the Catholic world at large.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_integration_progress: "#bold #khoine Integration Progress#!#!"
 kog_gui_integration_progress_desc: "TODO"
 kog_gui_enforce_seat: "@kog_integrate_seat! #bold Enforce Rites#!"
 kog_gui_enforce_seat_desc: "In the centuries since the collapse of the Roman Empire, the many churches have deviated from each other in their chosen [concept_liturgical_rite]. Should the location of this seat come under our control, we could enforce their compliance with our [concept_liturgical_rite].\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_enforcement_progress: "#bold #khoine Enforcement Progress#!#!"
 kog_gui_enforcement_progress_desc: "TODO"
 
 kog_gui_improve_relations: "@kog_improve_relations! #bold Improve Relations#!"
 kog_gui_improve_relations_desc: "Within the fabric of Christendom, the Patriarchates often find themselves at odds with each other. By ingratiating ourselves to them, we may be able to count on their support in the spiritual affairs of the state.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_cease_diplomacy: "@kog_improve_relations! #bold Cease Diplomacy#!"
 kog_gui_cease_diplomacy_desc: "This will free up our resources for diplomatic efforts elsewhere.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 kog_gui_damage_relations: "@kog_damage_relations! #bold Damage Relations#!"
 kog_gui_damage_relations_desc: "Within the fabric of Christendom, the Patriarchates often find themselves at odds with each other. By ensuring hostilities between ourselves and certain seats, we can earn the respect of those of our faith community.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]
 kog_gui_cease_hostilities: "@kog_damage_relations! #bold Cease Hostilities#!"
 kog_gui_cease_hostilities_desc: "This will free up our resources for diplomatic efforts elsewhere.\n$TOOLTIP_DELIMITER$\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 
 kog_gui_catholic_event_counter: "[Concept('concept_ecumenical_council','$concept_councils$')] Convoked: #bold [GetGlobalVariable('kog_council_var').GetValue]#!\n[Concept('concept_crusades','$concept_crusades$')] Launched: #bold [GetGlobalVariable('kog_crusade_counter').GetValue]#!\n[Concept('concept_episcopal_seat','$concept_patriarchs$')] Deposed: #bold [GetGlobalVariable('kog_deposition_counter').GetValue]#!"
