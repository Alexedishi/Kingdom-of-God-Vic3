 ## Canon Laws
 kog_canon_law_none: "#bold None#!"
 kog_canon_law_temp: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_temp_desc')]#!#!#!"
 kog_canon_law_temp_desc: "#filler kog_canon_law_temp_desc#!"
 kog_canon_law_detail: "Adopting this [concept_canon_law] will confer the following effects (modified by [concept_canon_law_compliance]):\n"
 
 kog_canon_lawgroup_apostolic_succession: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_lawgroup_apostolic_succession_desc')] Apostolic Succession#!#!#!"
 kog_canon_lawgroup_apostolic_succession_desc: "#bold Apostolic Succession#! is the belief by which a church traces the transmission of grace and ministerial authority from the disciples of Christ to the modern day. More ancient denominations, such as the [GetReligion('catholic').GetName] and [GetReligion('orthodox').GetName] Churches, assert that the consecration of Bishops by other Bishops is the only way to maintain the validity of priestly orders, while many [GetReligion('protestant').GetName] denominations assert this continuity is unnecessary and rooting in fundamental misunderstandings of scripture."
 kog_canon_law_papal_primacy: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_papal_primacy_desc')] Papal Primacy#!#!#!"
 kog_canon_law_papal_primacy_desc: "A single Bishop is elevated above the all others and wields sovereign and absolute authority over all other Bishops. In such a system, deviation from the mother church is tantamount to [concept_schism].$kog_linebreak$$kog_canon_law_detail$[GetStaticModifier('modifier_kog_canon_law_papal_primacy').GetDesc]"
 kog_canon_law_synodality: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_synodality_desc')] Synodality#!#!#!"
 kog_canon_law_synodality_desc: "Churches are lead by group of elected bishops who cooperate in administering the church. While specific Bishops may be recognized as more senior or prestigious, no church hold authority over any other.$kog_linebreak$$kog_canon_law_detail$[GetStaticModifier('modifier_kog_canon_law_synodality').GetDesc]"
 kog_canon_law_congregationalism: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_congregationalism_desc')] Congregationalism#!#!#!"
 kog_canon_law_congregationalism_desc: "Every local church, or congregation, operates with full independence as has full rights to interpret and preach scripture. In such a system, any central authority is hypothetical at best and fundamental theological disagreements are commonplace.$kog_linebreak$$kog_canon_law_detail$[GetStaticModifier('modifier_kog_canon_law_congregationalism').GetDesc]"
 
 kog_canon_lawgroup_almsgiving: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_lawgroup_almsgiving_desc')] Almsgiving#!#!#!"
 kog_canon_lawgroup_almsgiving_desc: ""
