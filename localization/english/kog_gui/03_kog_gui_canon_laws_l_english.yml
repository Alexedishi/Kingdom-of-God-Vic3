 kog_canon_law_offertory: "#bold #yellow #tooltip:[GetRawTextTooltipTag('kog_canon_law_offertory_desc')] Offertory#!#!#"
 kog_canon_law_offertory_desc: "$kog_linebreak$$kog_canon_law_detail$[GetStaticModifier('modifier_kog_canon_law_offertory').GetDesc]"
