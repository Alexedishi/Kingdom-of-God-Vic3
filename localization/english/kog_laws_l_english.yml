l_english:
 # Custom Laws for Existing Groups
 law_papal_see: "The Papal See"
 law_papal_see_desc: "The state is understood to be the manifestation of the temporal powers of the Pope."
 law_state_church: "State Church"
 law_state_church_desc: "The Church is structured as a department of state and administered as part of the government apparatus."
 
 # Investiture
 lawgroup_investiture: "Investiture"
 lawgroup_investiture_desc: "How religious officiants are invested with their temporal offices."
 law_theocratic_investiture: "Theocratic Investiture"
 law_theocratic_investiture_desc: "The investiture of priests is performed by the Ecclesiarchy."
 law_ecclesiastic_investiture: "Ecclesiastic Investiture"
 law_ecclesiastic_investiture_desc: "The investiture of priests is performed by the Church with no input from the state."
 law_oath_of_supremacy: "Oath of Supremacy"
 law_oath_of_supremacy_desc: "The investiture of priests is performed by the Church, but newly appointed priests much first swear allegiance to the state before they can exercise any authority."
 law_concordat_of_investment: "Concordat of Investment"
 law_concordat_of_investment_desc: "The nomination of priests is performed by the state with little input from the Church, although the investment ceremony is conducted by members of the Church."
 law_lay_investiture: "Lay Investiture"
 law_lay_investiture_desc: "The investiture of priests is performed by members of the competent authorities with no input from the Church."
 law_clerical_offices_abolished: "Clerical Offices Abolished"
 law_clerical_offices_abolished_desc: "The institution of the priesthood has been officially abolished and suppressed by the state."
 
 # Church Holdings
 lawgroup_church_holdings: "Church Holdings"
 lawgroup_church_holdings_desc: "How the state regulates the operations of monastic estates in the nation."
 law_monastic_secularization: "Monastic Secularization"
 law_monastic_secularization_desc: "All monastic land has been seized by the state for non-clerical uses."
 law_monastic_suppression: "Monastic Suppression"
 law_monastic_suppression_desc: "The monasteries are inhibited from retaining unbroken control over their holdings and are subject to taxation."
 law_monastic_holdings: "Monastic Holdings"
 law_monastic_holdings_desc: "Monasteries are permitted to exist and function without any intervention by the state."
 
 # Church Taxes
 lawgroup_church_tax: "Church Taxes"
 lawgroup_church_tax_desc: "How the state provides financial support to the church, if any is given."
 law_no_church_tax: "No Church Tax"
 law_no_church_tax_desc: "The state provides no financial support for the church."
 law_church_grants: "Church Grants"
 law_church_grants_desc: "The state provides funding for the church from the state budget."
 law_individual_church_tax: "Individual Church Tax"
 law_individual_church_tax_desc: "Funding for the church is provided by means of a tax levied on the faithful."
 law_general_church_tax: "General Church Tax"
 law_general_church_tax_desc: "Funding for the church is provided by means of generalized taxation."