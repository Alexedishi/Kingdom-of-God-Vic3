 kog_general.100.t: "The Council of Unification"
 kog_general.100.d: "[SCOPE.sCountry('kog_mending_country_scope').GetName] has convoked an Ecumenical Council to declare their intent to unify the two largest branches of Christianity. While the state controls the seats of both the East and West, there remains a herculean amount of work to be done."
 kog_general.100.f: "The churches of the East and West agree on overarching concepts of faith, but nearly a millennium of Schism has introduced tremendous deviations that must be reconciled before we can dream of a united church."
 kog_general.100.a: "Will Christendom be whole once more?"
