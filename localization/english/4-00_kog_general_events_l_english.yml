 kog_general.620.t: "Control Secured Over $kog_rome$"
 kog_general.620.d: "Our bishops have secured control of the seat of $kog_rome$. All bishops still loyal to [SCOPE.sCountry(kog_rome_controller_scope).GetName] have been removed from high offices and relegated to cermonial roles or forced into retirement."
 kog_general.620.f: "To challenge $kog_control$ of any seat is to assert dominance over the [ROOT.GetCountry.GetStateReligion.GetName] faith as a whole. This will be seen as a breach of divine order."
 kog_general.620.a: "$kog_rome$ will be safe with [ROOT.GetCountry.GetName]."
