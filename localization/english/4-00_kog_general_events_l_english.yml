 kog_general.121.t: "The Capture of the Great Mosque"
 kog_general.121.d: "Our righteous crusades against the Saracens have brought their jewel, the heathen city of Mecca, into our grasp."
 kog_general.121.f: "One by one, rank after rank of Byzantine soldiers advanced into the city. There we beheld the Great Mosque, and at its heart the pagan relic, the al-Ḥajaru al-Aswad... the #black Black Stone#!."
 kog_general.121.a: "We bring no peace. Burn it all down."
 kog_general.121.b: "We will turn it into a museum."
 kog_general.121.c: "The Saracens kept peace in Jerusalem. We will keep peace in Mecca."
