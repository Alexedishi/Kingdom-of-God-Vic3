 kog_general.629.f: "To challenge $kog_control$ of any seat is to assert dominance over the [ROOT.GetCountry.GetStateReligion.GetName] faith as a whole. This will be seen as a breach of divine order."
 kog_general.629.a: "$kog_moscow$ will be safe with [ROOT.GetCountry.GetName]."

