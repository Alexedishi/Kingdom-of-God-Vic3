 kog_general.700.t: "Ecumenical Financing"
 kog_general.700.d: "The Patriarch of [Country.GetCustom('kog_seat_event_type')] has requested the release of state funds for the Church. In exchange, he has offered to broker increased cooperation between [ROOT.GetCountry.GetName] and the bishops of [Country.GetCustom('kog_seat_event_type')]."
 kog_general.700.f: "Throughout its existence, the Church has depended on the state for support in exchange for cooperation in the regulation and management of the Orthodox populations."
 kog_general.700.a: "They will have their funding."
 kog_general.700.b: "We cannot spare the expense."
 kog_general.701.t: "Patriarchal Delegation Arrives"
 kog_general.701.d: "A delegation representing [Country.GetCustom('kog_seat_event_type')] has been received by our Metropolitan [SCOPE.gsInterestGroup('devout_scope').GetLeader.GetFirstName] in [ROOT.GetCountry.GetCapital.GetCityHubName]. After productive conversations regarding commonalities of dogma, the Metropolitan has suggested allowing them to address the National Assembly."
 kog_general.701.f: "While faith is integral to the state, some intellectual leaders have cautioned against the unregulated mixture of politics and faith."
 kog_general.701.a: "We will receive them in [ROOT.GetCounty.GetCapital.GetCityHubName]."
 kog_general.701.b: "The state cannot show any favoritism."
 kog_general.702.t: "Patriarch Condemns Immorality"
 kog_general.702.d: "In a scathing letter, [SCOPE.sCharacter('kog_patriarch_event_scope').GetFirstName], the Patriarch of [SCOPE.GetRootScope.GetCountry.GetCustom('kog_seat_event_type')] has condemned the immorality of [ROOT.GetCountry.GetName], declared that we have abused our [concept_autocephaly] to lead the faithful into apostacy."
 kog_general.702.f: ""
 kog_general.702.a: "Spineless Zealot"
