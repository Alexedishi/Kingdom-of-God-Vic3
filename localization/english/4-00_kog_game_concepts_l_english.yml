l_english:
 concept_autocephaly: "Autocephaly"
 concept_autocephaly_desc: "While nominally a single ecumenical church, the non-[GetReligion('catholic').GetName] Church structures are much more decentralized than their Western counterpart in Rome. Every nation plays host to prominent bishops that exert influence over the worship in their domain, sometimes in deviation from the #italic Primus Inter Pares#!, or First Among Equals, $kog_patriarch$ at the head of the church. #bold Autocephalous#! churches have heads who do not report to any higher Bishop such as the Patriarch of Constantinople or the Bishop of Rome."
 concept_autocephalous: "Autocephalous"
 concept_crusades: "Crusades"
 concept_crusades_desc: "The Crusades were a series of religiously-motivated wars initiated by Western European countries against non-Christians. While popularly conceptualized as centered on reclaiming the Holy Land from Muslim rulers, similar religious conflicts saw Christian expansion into Scandinavia, Eastern Europe, and Iberia. These wars were generally motivated by a desire for fame from nobles and a desire for indulgences by the commonfolk."
 concept_crusade: "Crusade"
 concept_ecumenical_council: "Ecumenical Council"
 concept_ecumenical_council_desc: "#bold Ecumenical Councils#! are large gatherings of prominent bishops for the purpose of settling religious questions or disputes. First called by the Roman Emperors, these councils have become a cornerstone of making critical interpretations of or changes to church dogma. In modern Christianity, these are held to be the supreme legal authority in the church... provided their contents are accepted by the Christian community at large."
 concept_ecumenism: "Ecumenism"
 concept_ecumenism_desc: "Ecumenism is the belief and goal that all Christian communities, regardless of differences in creeds and doctrine should cooperate to bring together the various Christian denominations and reunite into a Great Church. While unthinkable in previous eras, this idea has begun to take hold as Traditionalist thought slowly gives way to more moderate thinking."
 concept_ecumenical_relations: "Ecumenical Relations"
 concept_councils: "Ecumenical Councils"
 concept_encyclical: "Encyclical"
 concept_encyclical_desc: "An #bold Encyclical#! is a circular letter sent out from either the Pope or other senior Bishops typically concerning matters of doctrine or dispute, meant to provide both clarification and direction to both the clergy and laity."
 concept_faith_capacity: "Religious Eminence"
 concept_faith_capacity_desc: "#bold Religious Eminence#! represents the extent to which the [concept_government] exerts influence, and sometimes direct control, over the [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant]. Generally, this value indicates a country’s ability to sway its local bishops, and our religious community at large, towards the will of the state."
 concept_faith_capacity_catholic: "Papal Eminence"
 concept_faith_capacity_orthodox: "Patriarchal Eminence"
 concept_faith_capacity_oriental: "Synodal Eminence"
 concept_faith_capacity_elysian: "Synkletos Eminence"
 concept_faith_capacity_anglican: ""
 concept_faith_capacity_lutheran: ""
 concept_great_schism: "The Great Schism"
 concept_great_schism_desc: "The #bold Great Schism#!, or East-West Schism, is a term used to describe the complex chain of events that led to the disintegration of communion between $kog_rome$ and the $kog_eastern_seats$. This division between the churches administered from Rome and those guided by Constantinople has led to deviations in liturgical and dogmatic traditions."
 concept_holy_site: "Holy Site"
 concept_holy_site_desc: "Holy Site"
 concept_liturgical_rite: "Liturgical Rite"
 concept_liturgical_rite_desc: "A #bold Liturgical Rite#! is a pattern for worship that provides structure for regular church services in a Christian communities. These take many forms from the centralized rituals prescribed by the [GetReligion('catholic').GetName] church to unique rituals localized to small communities."
 concept_liturgical_rites: "Liturgical Rite"
 concept_rite: "Rite"
 concept_rites: "Rite"
 concept_metropolitan_bishop: "Metropolitan Bishop"
 concept_metropolitan_bishop_desc: "Metropolitan Bishop"
 concept_patriarchal_seat: "Patriarchal Seat
 concept_patriarchal_seat_desc: "In late antiquity, the early Christian church was organized into five major regions, each centered on the ancient holy cites of #yellow Rome#!, #yellow Constantinople#!, #yellow Antioch#!, #yellow Jerusalem#!, and #yellow Alexandria#!. Following the Great Schism, the latter four would go on to form the #bold Eastern Orthodoxy.\n\nWith the spread of Christianity to the lands of the Slavs in the middle ages, #yellow Moscow#! has come to be recognized as one of the most important cities in the East, alongside the ancient Patriarchates.
 concept_patriarch: "Patriarch"
 concept_patriarchs: "Patriarchs"
 concept_patriarchate: "Patriarchate"
 concept_patriarchal_seats: "Patriarchal Seats"