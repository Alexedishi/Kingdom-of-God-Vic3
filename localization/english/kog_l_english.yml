 dp_crusade_tooltip: "#header Start a $dp_make_dominion$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_make_dominion_desc$"
 dp_crusade_desc: "Sets the initiating [concept_war_goal] to force the targeted [concept_country] to become your [concept_dominion]. If enforced, this is convert the targeted [concept_country] to convert its state religion to your state religion."

 # Game Concepts
 concept_autocephaly: "Autocephaly"
 concept_autocephaly_desc: "While nominally a single ecumenical church, the non-[GetReligion('catholic').GetName] Church structures are much more decentralized than their Western counterpart in Rome. Every nation plays host to prominent bishops that exert influence over the worship in their domain, sometimes in deviation from the #italic Primus Inter Pares#!, or First Among Equals, $kog_patriarch$ at the head of the church. #bold Autocephalous#! churches have heads who do not report to any higher Bishop such as the Patriarch of Constantinople or the Bishop of Rome."
 concept_autocephalous: "Autocephalous"
 concept_crusades: "Crusades"
 concept_crusades_desc: "The Crusades were a series of religiously-motivated wars initiated by Western European countries against non-Christians. While popularly conceptualized as centered on reclaiming the Holy Land from Muslim rulers, similar religious conflicts saw Christian expansion into Scandinavia, Eastern Europe, and Iberia. These wars were generally motivated by a desire for fame from nobles and a desire for indulgences by the commonfolk."
 concept_crusade: "Crusade"
 concept_ecumenical_council: "Ecumenical Council"
 concept_ecumenical_council_desc: "#bold Ecumenical Councils#! are large gatherings of prominent bishops for the purpose of settling religious questions or disputes. First called by the Roman Emperors, these councils have become a cornerstone of making critical interpretations of or changes to church dogma. In modern Christianity, these are held to be the supreme legal authority in the church... provided their contents are accepted by the Christian community at large."
 concept_ecumenism: "Ecumenism"
 concept_ecumenism_desc: "Ecumenism is the belief and goal that all Christian communities, regardless of differences in creeds and doctrine should cooperate to bring together the various Christian denominations and reunite into a Great Church. While unthinkable in previous eras, this idea has begun to take hold as Traditionalist thought slowly gives way to more moderate thinking."
 concept_ecumenical_relations: "Ecumenical Relations"
 concept_councils: "Ecumenical Councils"
 concept_encyclical: "Encyclical"
 concept_encyclical_desc: "An #bold Encyclical#! is a circular letter sent out from either the Pope or other senior Bishops typically concerning matters of doctrine or dispute, meant to provide both clarification and direction to both the clergy and laity."
 concept_faith_capacity: "Religious Eminence"
 concept_faith_capacity_desc: "#bold Religious Eminence#! represents the extent to which the [concept_government] exerts influence, and sometimes direct control, over the [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant]. Generally, this value indicates a country’s ability to sway its local bishops, and our religious community at large, towards the will of the state."
 concept_faith_capacity_catholic: "Papal Eminence"
 concept_faith_capacity_orthodox: "Patriarchal Eminence"
 concept_faith_capacity_oriental: "Synodal Eminence"
 concept_faith_capacity_elysian: "Synkletos Eminence"
 concept_faith_capacity_anglican: ""
 concept_faith_capacity_lutheran: ""
 concept_great_schism: "The Great Schism"
 concept_great_schism_desc: "The #bold Great Schism#!, or East-West Schism, is a term used to describe the complex chain of events that led to the disintegration of communion between $kog_rome$ and the $kog_eastern_seats$. This division between the churches administered from Rome and those guided by Constantinople has led to deviations in liturgical and dogmatic traditions."
 concept_holy_site: "Holy Site"
 concept_holy_site_desc: "Holy Site"
 concept_liturgical_rite: "Liturgical Rite"
 concept_liturgical_rite_desc: "A #bold Liturgical Rite#! is a pattern for worship that provides structure for regular church services in a Christian communities. These take many forms from the centralized rituals prescribed by the [GetReligion('catholic').GetName] church to unique rituals localized to small communities."
 concept_liturgical_rites: "Liturgical Rite"
 concept_rite: "Rite"
 concept_rites: "Rite"
 concept_metropolitan_bishop: "Metropolitan Bishop"
 concept_metropolitan_bishop_desc: "Metropolitan Bishop"
 concept_patriarchal_seat: "Patriarchal Seat
 concept_patriarchal_seat_desc: "In late antiquity, the early Christian church was organized into five major regions, each centered on the ancient holy cites of #yellow Rome#!, #yellow Constantinople#!, #yellow Antioch#!, #yellow Jerusalem#!, and #yellow Alexandria#!. Following the Great Schism, the latter four would go on to form the #bold Eastern Orthodoxy.\n\nWith the spread of Christianity to the lands of the Slavs in the middle ages, #yellow Moscow#! has come to be recognized as one of the most important cities in the East, alongside the ancient Patriarchates.
 concept_patriarch: "Patriarch"
 concept_patriarchs: "Patriarchs"
 concept_patriarchate: "Patriarchate"
 concept_patriarchal_seats: "Patriarchal Seats"
 
 # Journal Entries
 
 ## Roman Catholic Entries
 je_kog_ecyclical_mirari_vos: "Encyclical: #italic Mirari Vos#!"
 je_kog_ecyclical_mirari_vos_reason: "“#italic We have learned of the pamphlet written in French... for it has been printed by this man and disseminated everywhere.... Though small in size, it is enormous in wickedness.... Once the torch of treason is ignited everywhere, it ruins public order, fosters contempt of government, and stimulates lawlessness.... By Our apostolic power, We condemn the book....”#! -Pope Gregory XVI\n\n Published by French priest, Felicité Robert de Lamennais, the book #italic Paroles d’un croyant#! has ignited controversy by advocating for the separation of church and state and the abolition of the church monopoly on education. The Pope has both condemned the publication and urged Catholic nations to ensure the supremacy of the church in religious and social affairs."

 ## Eastern Orthodox Entries
 je_kog_encyclical_orthodox_easterners_1: "The Encyclical of the Eastern Patriarchs"
 je_kog_encyclical_orthodox_easterners_1_reason: "#italic “Filled with the desire to see you return to the fold of the Catholic Church, and to bless you as Our brothers and sons, and awaiting the day when this joy will be given us, We yet again attest Our affection and Our tenderness towards all the Catholics spread through all the lands of the East, to all Patriarchs, Primates, Archbishops, bishops, clergy and laity, and We confer on them Our apostolic blessing.”#! -Pope Pius IX, #italic Epistle to the Easterners,#! 1848\n\nThe [concept_ecumenical_council] has rejected the bank-handed olive branch extended by $kog_rome$. The Ecumenical Patriarch, [GetGlobalVariable('kog_constantinople_patriarch_var').GetFirstName], has issued an [concept_encyclical] calling for the cessation of any positive relations with the Pope."
 je_kog_encyclical_orthodox_easterners_2: "The Encyclical of the Eastern Patriarchs"
 je_kog_encyclical_orthodox_easterners_2_reason: "#italic “Filled with the desire to see you return to the fold of the Catholic Church, and to bless you as Our brothers and sons, and awaiting the day when this joy will be given us, We yet again attest Our affection and Our tenderness towards all the Catholics spread through all the lands of the East, to all Patriarchs, Primates, Archbishops, bishops, clergy and laity, and We confer on them Our apostolic blessing.”#! -Pope Pius IX, #italic Epistle to the Easterners,#! 1848\n\nThe [concept_ecumenical_council] has shocked the world by accepting the olive branch extended by $kog_rome$. The Ecumenical Patriarch, [GetGlobalVariable('kog_constantinople_patriarch_var').GetFirstName], has issued an [concept_encyclical] calling for the thawing of relations between the Pope and the Eastern Churches."
 je_kog_encyclical_orthodox_easterners_complete: "The #bold Progress Bar#! is greater than or equal to #bold #greece 90#!#!"
 je_kog_encyclical_orthodox_easterners_fail: "The #bold Progress Bar#! is less than #bold #greece 90#!#!"
 je_kog_encyclical_orthodox_fraternity: "The Encyclical of the Fraternity of Churches"
 je_kog_encyclical_orthodox_fraternity_reason: "The Ecumenical Patriarch, [GetGlobalVariable('kog_constantinople_patriarch_var').GetFirstName], concerned by the increasing capabilities of nation-states across Europe, has called for greater unity between the [GetReligion('orthodox').GetName] churches as a means to safeguard the churches from state interference.\n$TOOLTIP_DELIMITER$\n•$kog_constantinople_opinion$\n•$kog_antioch_opinion$\n•$kog_jerusalem_opinion$\n•$kog_alexandria_opinion$\n•$kog_moscow_opinion$"
 je_kog_encyclical_orthodox_fraternity_complete: "[ROOT.GetCountry.GetNameNoFlag] has $kog_relations$ of at least #bold #green 75#! or greater#! with at least #bold 2 or More#! $kog_patriarchs$"
 je_kog_encyclical_orthodox_fraternity_fail: "[ROOT.GetCountry.GetNameNoFlag] #bold does NOT#! have $kog_relations$ of at least #bold #green 75#! or greater#! with at least #bold 2 or More#! $kog_patriarchs$"

 je_kog_the_orthodox_realms: "The Orthodox Realms"
 je_kog_the_orthodox_realms_reason: "In the times of the Empire, it was the Patriarchate of Constantinople that saw the spread of Christianity across the steppes. Since the fall of the Queen of Cities, the Rus' barbarians have styled themselves as pretenders to the Patriarchal seat. Now that we control the cradles of Christianity, we should extend our oversight to the Greater Orthodox community."
 je_kog_the_orthodox_realms_constantinople: "Own #yellow Eastern Thrace#! and control the #bold Seat of Constantinople#!."
 je_kog_the_orthodox_realms_antioch: "Own #yellow Syria#! and control the #bold Seat of Antioch#!."
 je_kog_the_orthodox_realms_alexandria: "Own #yellow Lower Egypt#! and control the #bold Seat of Alexandria#!."
 je_kog_the_orthodox_realms_jerusalem: "Own #yellow Palestine#! and control the #bold Seat of Jerusalem#!."
 je_kog_the_orthodox_realms_metropolitan_lands: "Has completed the #bold The Metropolitan Lands#! [concept_journal_entry]"
 je_kog_the_orthodox_realms_holy_land: "Has completed the #bold The Holy Land#! [concept_journal_entry]"
 je_kog_the_orthodox_realms_black_sea: "Has completed the #bold Across the Hospitable Sea#! [concept_journal_entry]"
 je_kog_the_metropolitan_lands: "The Metropolitan Lands"
 je_kog_the_metropolitan_lands_reason: "In the decades following the Ascension of Christ and the missions of the Twelve Apostles, Anatolia served as the cradle of Early Christianity. We will free these lands from the Saracens."
 je_kog_the_metropolitan_lands_complete_1: "Directly or indirectly control 10 or more states in the Balkans."
 je_kog_the_metropolitan_lands_complete_2: "Directly or indirectly control 9 or more states in Anatolia."
 je_kog_the_holy_land: "The Holy Land"
 je_kog_the_holy_land_reason: "The Levant is the birthplace of Christianity and the Holiest Lands to our faith. The Patriarchs have both granted and imposed a mandate that we reclaim these lands from their Muslim occupiers."
 je_kog_texas_left: "Across the Hospitable Sea"
 je_kog_texas_left_reason: "The Black Sea was once entirely within the Greek sphere. We will bring relief to our people that still call its shores home."
 
